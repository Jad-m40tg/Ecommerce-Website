<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — Havenwood Admin</title>
  <meta name="description" content="Manage your Havenwood admin account: profile, password, security and activity." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root{--warm-white:#faf7f2;--cream:#f3eee6;--beige:#e8e0d3;--charcoal:#2b2926;--gray:#6f6a62;--wood:#a67c52;--sage:#6b7f5e;--sage-dark:#576a4c;--white:#fffdf9;--success:#6b7f5e;--warning:#c98a3a;--danger:#b3532e;--radius-lg:20px;--radius-md:12px;--radius-sm:8px;--radius-pill:999px;--shadow-soft:0 6px 24px rgba(43,41,38,.08);--shadow-lift:0 16px 40px rgba(43,41,38,.14);--sidebar-w:250px;--topbar-h:72px}
    *{margin:0;padding:0;box-sizing:border-box}html,body{min-height:100%}body{font-family:'Inter',sans-serif;background:var(--warm-white);color:var(--charcoal);-webkit-font-smoothing:antialiased;line-height:1.55}h1,h2,h3{font-family:'Playfair Display',serif;line-height:1.2}a{color:inherit;text-decoration:none}button,input,select,textarea{font-family:inherit}img{display:block;max-width:100%}
    .app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}
    .sidebar{background:var(--white);border-right:1px solid var(--beige);padding:24px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.sidebar .brand{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;padding:4px 8px 22px;border-bottom:1px solid var(--beige);margin-bottom:18px}.sidebar .brand span{color:var(--sage)}.nav-label{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gray);padding:6px 10px;margin-top:6px}.side-nav{list-style:none;display:flex;flex-direction:column;gap:2px}.side-nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius-md);color:var(--gray);font-size:14.5px;font-weight:500;transition:background .2s ease,color .2s ease,transform .15s ease}.side-nav a:hover{background:var(--cream);color:var(--charcoal);transform:translateX(2px)}.side-nav a.active{background:var(--charcoal);color:var(--warm-white)}.side-nav a.active svg{color:var(--warm-white)}.side-nav a.active:hover svg{color:var(--warm-white)}.side-nav svg{color:var(--gray);flex-shrink:0}.side-nav a:hover svg{color:var(--charcoal)}.sidebar-foot{margin-top:auto;padding-top:18px;border-top:1px solid var(--beige)}.sidebar-foot a.logout{color:var(--danger)}.sidebar-foot a.logout svg{color:var(--danger)}.sidebar-foot a.logout:hover{background:rgba(179,83,46,.08);color:var(--danger)}
    .main-col{min-width:0;position:relative}.topbar{position:sticky;top:0;z-index:40;height:var(--topbar-h);background:rgba(250,247,242,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--beige);display:flex;align-items:center;gap:20px;padding:0 32px}.search{position:relative;flex:1;max-width:460px}.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--gray)}.search input{width:100%;padding:10px 14px 10px 40px;border:1.5px solid var(--beige);border-radius:var(--radius-pill);background:var(--white);font-size:14px;color:var(--charcoal);transition:border-color .2s ease,box-shadow .2s ease}.search input:focus{outline:none;border-color:var(--sage);box-shadow:0 0 0 4px rgba(107,127,94,.12)}.top-actions{margin-left:auto;display:flex;align-items:center;gap:12px}.icon-btn{position:relative;width:40px;height:40px;border-radius:var(--radius-pill);border:1.5px solid var(--beige);background:var(--white);color:var(--charcoal);display:grid;place-items:center;cursor:pointer;transition:background .2s ease,border-color .2s ease}.icon-btn:hover{background:var(--cream);border-color:var(--charcoal)}.icon-btn .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;background:var(--wood);border-radius:50%;border:2px solid var(--white)}.admin-chip{display:flex;align-items:center;gap:10px;padding:5px 14px 5px 5px;border-radius:var(--radius-pill);background:var(--white);border:1.5px solid var(--beige);cursor:pointer;transition:background .2s ease,border-color .2s ease}.admin-chip:hover{background:var(--cream);border-color:var(--charcoal)}.admin-chip .avatar{width:32px;height:32px;border-radius:50%;background:var(--sage);color:var(--white);display:grid;place-items:center;font-weight:600;font-size:13px}.admin-chip .who{line-height:1.15}.admin-chip .who strong{display:block;font-size:13.5px;color:var(--charcoal)}.admin-chip .who span{display:block;font-size:11.5px;color:var(--gray)}
    .content{padding:32px;display:flex;flex-direction:column;gap:24px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}.page-head h1{font-size:clamp(24px,3vw,32px);color:var(--charcoal)}.page-head p{color:var(--gray);font-size:14.5px;margin-top:4px}
    .panel{background:var(--white);border:1px solid var(--beige);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow-soft)}.panel-title{font-family:'Playfair Display',serif;font-size:19px;color:var(--charcoal);padding-bottom:14px;margin-bottom:20px;border-bottom:1px solid var(--beige);display:flex;align-items:center;gap:10px}.panel-title svg{color:var(--sage)}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:600;color:var(--charcoal)}.field .hint{font-size:12px;color:var(--gray);font-weight:400;margin-left:6px}
    .input,.textarea,select.input{width:100%;padding:11px 14px;border:1.5px solid var(--beige);border-radius:var(--radius-md);background:var(--warm-white);font-size:14px;color:var(--charcoal);transition:border-color .2s ease,box-shadow .2s ease}.textarea{resize:vertical;min-height:90px;line-height:1.5}.input:focus,.textarea:focus,select.input:focus{outline:none;border-color:var(--sage);box-shadow:0 0 0 4px rgba(107,127,94,.12)}
    .switch-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--beige)}.switch-row:last-child{border-bottom:none}.switch-row .switch-label strong{display:block;font-size:14px;font-weight:600;color:var(--charcoal)}.switch-row .switch-label span{font-size:12.5px;color:var(--gray)}.switch{position:relative;width:46px;height:26px;flex-shrink:0}.switch input{opacity:0;width:0;height:0}.switch .track{position:absolute;inset:0;cursor:pointer;background:var(--beige);border-radius:var(--radius-pill);transition:background .25s ease}.switch .track::before{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;background:var(--white);border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .25s ease}.switch input:checked+.track{background:var(--sage)}.switch input:checked+.track::before{transform:translateX(20px)}
    .save-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:18px 22px;background:var(--white);border:1px solid var(--beige);border-radius:var(--radius-lg);box-shadow:var(--shadow-soft);margin-top:4px}.save-bar .spacer{flex:1}.qa-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:var(--radius-pill);border:1.5px solid var(--charcoal);background:transparent;color:var(--charcoal);font-size:13.5px;font-weight:600;cursor:pointer;transition:background .25s ease,color .25s ease}.qa-btn:hover{background:var(--charcoal);color:var(--warm-white)}.qa-btn.primary{background:var(--sage);border-color:var(--sage);color:var(--white)}.qa-btn.primary:hover{background:var(--sage-dark);border-color:var(--sage-dark)}.qa-btn.danger{border-color:var(--danger);color:var(--danger)}.qa-btn.danger:hover{background:var(--danger);border-color:var(--danger);color:var(--white)}
    .toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,20px);background:var(--charcoal);color:var(--warm-white);padding:13px 22px;border-radius:var(--radius-pill);font-size:14px;font-weight:500;box-shadow:var(--shadow-lift);opacity:0;pointer-events:none;transition:opacity .3s ease,transform .3s ease;z-index:90}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:1080px){.form-grid{grid-template-columns:1fr}}@media(max-width:860px){.app{grid-template-columns:1fr}.sidebar{position:static;height:auto}.side-nav{flex-direction:row;overflow-x:auto;gap:6px}.side-nav a{white-space:nowrap}.nav-label,.sidebar-foot{display:none}.sidebar .brand{border-bottom:none;padding-bottom:12px;margin-bottom:8px}.topbar{padding:0 20px;gap:10px}.admin-chip .who{display:none}.content{padding:20px}}
  </style>
</head>
<body>

  <div class="app">
    <aside class="sidebar">
      <div class="brand">Haven<span>wood</span></div>
      <span class="nav-label">Main</span>
      <ul class="side-nav">
        <li><a href="admin-dashboard.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Dashboard</a></li>
        <li><a href="admin-products.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>Products</a></li>
        <li><a href="admin-orders.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>Orders</a></li>
        <li><a href="admin-customers.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Customers</a></li>
        <li><a href="admin-categories.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Categories</a></li>
        <li><a href="admin-analytics.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></svg>Analytics</a></li>
      </ul>
      <span class="nav-label" style="margin-top:16px">System</span>
      <ul class="side-nav">
        <li><a class="active" href="admin-profile.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/></svg>Profile</a></li>
        <li><a href="admin-settings.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</a></li>
      </ul>
      <div class="sidebar-foot"><ul class="side-nav"><li><a href="#" class="logout" id="logoutBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>Logout</a></li></ul></div>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <div class="top-actions">
          <button class="icon-btn" onclick="window.location.href='admin-dashboard.html'" aria-label="Notifications"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="dot"></span></button>
          <div class="admin-chip"><div class="avatar" id="avatarInit">A</div><div class="who"><strong id="displayName">Admin</strong><span>Store admin</span></div></div>
        </div>
      </header>

      <main class="content">
        <section class="page-head"><div><h1>Profile</h1><p>Manage your account, security and preferences.</p></div></section>

        <form id="profileForm" novalidate>
          <section class="panel">
            <h2 class="panel-title"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Personal Information</h2>
            <div class="form-grid">
              <div class="field"><label for="pName">Full Name</label><input class="input" type="text" id="pName" /></div>
              <div class="field"><label for="pEmail">Email</label><input class="input" type="email" id="pEmail" /></div>
              <div class="field"><label for="pPhone">Phone</label><input class="input" type="tel" id="pPhone" /></div>
              <div class="field full"><label for="pAddress">Address</label><input class="input" type="text" id="pAddress" /></div>
            </div>
          </section>

          <section class="panel">
            <h2 class="panel-title"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Change Password</h2>
            <div class="form-grid">
              <div class="field full"><label for="currentPass">Current Password</label><input class="input" type="password" id="currentPass" placeholder="Enter current password" autocomplete="current-password" /></div>
              <div class="field"><label for="newPass">New Password</label><input class="input" type="password" id="newPass" placeholder="Enter new password" autocomplete="new-password" /></div>
              <div class="field"><label for="confirmPass">Confirm New Password</label><input class="input" type="password" id="confirmPass" placeholder="Confirm new password" autocomplete="new-password" /></div>
            </div>
          </section>

          <div class="save-bar"><span class="spacer"></span><button type="submit" class="qa-btn primary">Save Changes</button></div>
        </form>
      </main>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      var token = localStorage.getItem('admin_token');
      if (!token) { window.location.href = 'admin-login.html'; return; }
      function authHeaders() { return { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }; }
      function apiFetch(url, opts) { opts = opts || {}; opts.headers = Object.assign(authHeaders(), opts.headers || {}); return fetch(url, opts).then(function (r) { if (r.status === 401 || r.status === 403) { localStorage.removeItem('admin_token'); window.location.href = 'admin-login.html'; throw new Error('Unauthorized'); } return r.json(); }); }

      document.getElementById('logoutBtn').addEventListener('click', function (e) { e.preventDefault(); apiFetch('/api/auth/logout', { method: 'POST' }).catch(function (err) { console.error(err); }); localStorage.removeItem('admin_token'); window.location.href = 'admin-login.html'; });

      var toastTimer = null;
      function showToast(msg) { var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2200); }

      apiFetch('/api/admin/me').then(function (data) {
        var user = data.admin || data;
        if (user.name) { document.getElementById('pName').value = user.name; document.getElementById('displayName').textContent = user.name.split(' ')[0]; document.getElementById('avatarInit').textContent = user.name.charAt(0).toUpperCase(); }
        if (user.email) document.getElementById('pEmail').value = user.email;
      }).catch(function (err) { console.error(err); showToast('Failed to load profile'); });

      document.getElementById('profileForm').addEventListener('submit', function (e) {
        e.preventDefault();
        if (!confirm('Save these changes? They will be visible on the storefront.')) return;
        var np = document.getElementById('newPass').value;
        var cp = document.getElementById('confirmPass').value;
        if (np || cp) {
          if (np !== cp) { showToast('New passwords do not match'); return; }
          if (np.length < 8) { showToast('Password must be at least 8 characters'); return; }
        }
        var saveBtn = this.querySelector('button[type="submit"]');
        saveBtn.disabled = true;
        var body = {
          name: document.getElementById('pName').value.trim(),
          email: document.getElementById('pEmail').value.trim()
        };

        var savePromises = [apiFetch('/api/admin/me', { method: 'PUT', body: JSON.stringify(body) })];

        if (np) {
          savePromises.push(apiFetch('/api/admin/password', { method: 'PUT', body: JSON.stringify({ current_password: document.getElementById('currentPass').value, new_password: np }) }));
        }

        Promise.all(savePromises)
          .then(function () { showToast('Profile saved'); if (body.name) { document.getElementById('displayName').textContent = body.name.split(' ')[0]; document.getElementById('avatarInit').textContent = body.name.charAt(0).toUpperCase(); } })
          .catch(function () { showToast('Failed to save profile'); })
          .finally(function () { saveBtn.disabled = false; });
      });

    })();
  </script>
</body>
</html>
