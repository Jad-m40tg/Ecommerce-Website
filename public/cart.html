  <!-- Same font pairing as the rest of the site -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

  <link rel="stylesheet" href="css/global.css?v=23" />
  <link rel="stylesheet" href="css/base.css?v=25" />
  <link rel="stylesheet" href="css/navbar.css?v=26" />
  <link rel="stylesheet" href="css/buttons.css?v=22" />

  <link rel="stylesheet" href="css/reveal.css?v=22" />
  <link rel="stylesheet" href="css/toast.css?v=22" />
  <link rel="stylesheet" href="css/skeleton.css?v=22" />
  <link rel="stylesheet" href="css/shared-responsive.css?v=23" />
  <link rel="stylesheet" href="css/cart.css?v=22" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css?v=22" />
</head>

<body>

  <a class="skip-link" href="#main" data-i18n="common:skip_to_content">Skip to content</a>

  <!-- ==========================================================
       NAVBAR - same structure/markup as the homepage
       ========================================================== -->
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="brand"><img src="/assets/Boularas_Logo.png" alt="Boularas logo" data-i18n-attr="alt:customer:nav.brand_alt" class="brand-logo" /></a>

      <nav aria-label="Main navigation" data-i18n-attr="aria-label:customer:nav.main_nav_aria">
        <ul class="nav-links" id="navLinks">
          <li><a href="index.html" data-i18n="customer:nav.home">Home</a></li>
          <li><a href="products.html" data-i18n="customer:nav.shop">Shop</a></li>
          <li><a href="categories.html" data-i18n="customer:nav.categories">Categories</a></li>
          <li><a href="offers.html" data-i18n="customer:nav.offers">Offers</a></li>
        </ul>
      </nav>

      <div class="navbar-actions">
        <a href="search-results.html" class="nav-search" aria-label="Search products" data-i18n-attr="aria-label:customer:nav.search_aria"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></a>
        <a href="wishlist.html" class="nav-wish" aria-label="Wishlist" data-i18n-attr="aria-label:customer:nav.wishlist_aria"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span class="wish-count" id="wishCount">0</span></a>
        <a href="cart.html" class="cart-btn" aria-label="Shopping cart" data-i18n-attr="aria-label:customer:nav.cart_aria">
          <span class="cart-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg></span><span class="cart-label" data-i18n="customer:nav.cart">Cart</span> <span class="cart-count" id="cartCount">0</span>
        </a>
        <button class="menu-toggle" data-i18n-attr="aria-label:customer:nav.toggle_aria" id="menuToggle" type="button" aria-label="Toggle menu">&#9776;</button>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1">

    <!-- ==========================================================
         BREADCRUMB
         ========================================================== -->
    <div class="container">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html" data-i18n="customer:nav.home">Home</a>
        <span class="sep">/</span>
        <a href="products.html" data-i18n="customer:nav.shop">Shop</a>
        <span class="sep">/</span>
        <span class="current" data-i18n="customer:nav.cart">Cart</span>
      </nav>
    </div>

    <!-- ==========================================================
         PAGE HEAD
         ========================================================== -->
    <div class="container page-head">
      <h1 data-i18n="customer:cart.your_cart">Your Cart</h1>
      <p id="pageSubtitle" data-i18n="customer:cart.subtitle_default">Review your items before checkout.</p>
    </div>

    <!-- ==========================================================
         CART LAYOUT
         Items are rendered by JS into #cartItems.
         Summary is rendered by JS into #summaryPanel.
         ========================================================== -->
    <div class="container">
      <div class="cart-layout">

        <div class="cart-items reveal" id="cartItems">
          <!-- Rendered by JS -->
        </div>

        <aside class="summary reveal" id="summaryPanel">
          <!-- Rendered by JS -->
        </aside>

      </div>
    </div>

  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="utils.js?v=22"></script>
  <script src="js/footer.js?v=22"></script>
  <script src="js/cart-utils.js?v=22"></script>
  <script src="js/cart.js?v=22"></script>
  <script src="js/language.js?v=23"></script>
  <script src="js/vendor/i18next.min.js"></script>
  <script src="js/vendor/i18next-http-backend.min.js"></script>
  <script src="js/i18n-init.js?v=1"></script>
  <script src="js/i18n-helper.js?v=1"></script>
