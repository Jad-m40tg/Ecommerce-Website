<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Havenwood</title>
  <meta name="description" content="Sign in to the Havenwood admin dashboard." />

  <!-- Same fonts as the rest of the site -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ============================================================
       DESIGN TOKENS — matched to the main site (Havenwood palette)
       ============================================================ */
    :root {
      --warm-white: #faf7f2;
      --cream:      #f3eee6;
      --beige:      #e8e0d3;
      --charcoal:   #2b2926;
      --gray:       #6f6a62;
      --wood:       #a67c52;
      --sage:       #6b7f5e;
      --sage-dark:  #576a4c;
      --white:      #fffdf9;
      --danger:     #b3532e;

      --radius-lg: 20px;
      --radius-md: 12px;
      --radius-pill: 999px;
      --shadow-soft: 0 6px 24px rgba(43, 41, 38, 0.08);
      --shadow-lift: 0 16px 40px rgba(43, 41, 38, 0.14);
    }

    /* ============================================================
       RESET + BASE
       ============================================================ */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      font-family: 'Inter', sans-serif;
      color: var(--charcoal);
      background: var(--warm-white);
      -webkit-font-smoothing: antialiased;
      line-height: 1.6;
    }
    h1, h2 { font-family: 'Playfair Display', serif; line-height: 1.2; }
    a { color: inherit; text-decoration: none; }
    button, input { font-family: inherit; }

    /* ============================================================
       PAGE LAYOUT — centered card on soft warm background
       Two soft radial glows echo the wood + sage accent colors.
       ============================================================ */
    .login-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 20px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(1000px 500px at 12% 10%, rgba(166, 124, 82, 0.18), transparent 60%),
        radial-gradient(900px 500px at 88% 90%, rgba(107, 127, 94, 0.18), transparent 60%),
        var(--warm-white);
    }

    /* Decorative floating shapes for subtle motion */
    .float-shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(2px);
      opacity: 0.55;
      pointer-events: none;
      animation: float 12s ease-in-out infinite;
    }
    .float-shape.one   { width: 140px; height: 140px; top: 12%; left: 8%;  background: var(--cream); }
    .float-shape.two   { width: 90px;  height: 90px;  top: 70%; left: 15%; background: var(--beige); animation-delay: -3s; }
    .float-shape.three { width: 180px; height: 180px; top: 20%; right: 10%; background: var(--cream); animation-delay: -6s; }
    .float-shape.four  { width: 110px; height: 110px; bottom: 15%; right: 18%; background: var(--beige); animation-delay: -9s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) translateX(0); }
      50%      { transform: translateY(-18px) translateX(10px); }
    }

    /* ============================================================
       LOGIN CARD
       ============================================================ */
    .login-card {
      position: relative;
      width: 100%;
      max-width: 440px;
      background: var(--white);
      border: 1px solid var(--beige);
      border-radius: var(--radius-lg);
      padding: 44px 40px;
      box-shadow: var(--shadow-lift);
      animation: rise 0.7s ease both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Logo / brand block at top */
    .brand-block { text-align: center; margin-bottom: 28px; }
    .brand {
      font-family: 'Playfair Display', serif;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: var(--charcoal);
    }
    .brand span { color: var(--sage); }

    .brand-eyebrow {
      display: inline-block;
      margin-top: 10px;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--sage);
      padding: 5px 12px;
      background: var(--cream);
      border-radius: var(--radius-pill);
    }

    .login-card h1 {
      font-size: 26px;
      text-align: center;
      margin-top: 20px;
      color: var(--charcoal);
    }
    .login-sub {
      text-align: center;
      color: var(--gray);
      font-size: 14.5px;
      margin-top: 6px;
      margin-bottom: 28px;
    }

    /* ============================================================
       FORM
       ============================================================ */
    .form-group { margin-bottom: 16px; }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--charcoal);
      margin-bottom: 6px;
    }

    .input-wrap { position: relative; }

    .input-wrap .lead-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray);
      pointer-events: none;
    }

    .form-group input[type="email"],
    .form-group input[type="password"],
    .form-group input[type="text"] {
      width: 100%;
      padding: 13px 38px 13px 42px;
      border: 1.5px solid var(--beige);
      border-radius: var(--radius-md);
      background: var(--warm-white);
      font-size: 14.5px;
      color: var(--charcoal);
      transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--sage);
      background: var(--white);
      box-shadow: 0 0 0 4px rgba(107, 127, 94, 0.12);
    }

    /* Password reveal toggle */
    .toggle-pass {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--gray);
      padding: 6px;
      border-radius: 6px;
    }
    .toggle-pass:hover { color: var(--charcoal); background: var(--cream); }

    /* Row: remember me + forgot password */
    .row-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 8px 0 22px;
      font-size: 14px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--gray);
      cursor: pointer;
      user-select: none;
    }
    .remember input {
      width: 16px; height: 16px;
      accent-color: var(--sage);
      cursor: pointer;
    }

    .forgot {
      color: var(--sage);
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .forgot:hover { color: var(--sage-dark); text-decoration: underline; }

    /* Primary login button */
    .btn-login {
      width: 100%;
      padding: 13px 20px;
      border: none;
      border-radius: var(--radius-md);
      background: var(--sage);
      color: var(--white);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: background 0.25s ease, transform 0.1s ease, box-shadow 0.25s ease;
    }
    .btn-login:hover  { background: var(--sage-dark); box-shadow: var(--shadow-soft); }
    .btn-login:active { transform: translateY(1px); }

    /* Footer note under card */
    .card-footer {
      margin-top: 22px;
      text-align: center;
      font-size: 13px;
      color: var(--gray);
    }
    .card-footer a { color: var(--sage); font-weight: 600; }
    .card-footer a:hover { text-decoration: underline; }

    /* Small responsive tweaks */
    @media (max-width: 720px) {
      .container { padding: 0 20px; }
    }
    @media (max-width: 480px) {
      .login-card { padding: 34px 24px; }
    }
    @media (max-width: 400px) {
      .container { padding: 0 14px; }
      .login-card { padding: 28px 20px; }
      .brand { font-size: 20px; }
    }
  </style>
</head>
<body>

  <div class="login-page">
    <!-- Decorative background shapes -->
    <span class="float-shape one"></span>
    <span class="float-shape two"></span>
    <span class="float-shape three"></span>
    <span class="float-shape four"></span>

    <!-- ============================================================
         LOGIN CARD
         ============================================================ -->
    <main class="login-card" role="main">
      <div class="brand-block">
        <div class="brand">Haven<span>wood</span></div>
        <span class="brand-eyebrow">Admin Portal</span>
      </div>

      <h1>Welcome back</h1>
      <p class="login-sub">Sign in to manage your store</p>

      <!-- Login form (visual only — no real auth) -->
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Email address</label>
          <div class="input-wrap">
            <!-- mail icon -->
            <svg class="lead-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            <input type="email" id="email" name="email" placeholder="admin@havenwood.com" required />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <!-- lock icon -->
            <svg class="lead-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            <input type="password" id="password" name="password" placeholder="Enter your password" required />
            <!-- Reveal password toggle -->
            <button type="button" class="toggle-pass" id="togglePass" aria-label="Show password">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="row-between">
          <label class="remember">
            <input type="checkbox" name="remember" /> Remember me
          </label>
          <a href="#" class="forgot">Forgot password?</a>
        </div>

        <button type="submit" class="btn-login">Sign in to Dashboard</button>
      </form>

      <p class="card-footer">Protected area · <a href="index.html">Back to store</a></p>
    </main>
  </div>

  <!-- ============================================================
       SCRIPT — password toggle + demo form submit
       ============================================================ -->
  <script>
    // Toggle password visibility
    const toggle = document.getElementById('togglePass');
    const passInput = document.getElementById('password');
    const EYE_OPEN = '<svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
    const EYE_OFF = '<svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

    toggle.addEventListener('click', () => {
      const isPass = passInput.type === 'password';
      passInput.type = isPass ? 'text' : 'password';
      toggle.setAttribute('aria-label', isPass ? 'Hide password' : 'Show password');
      toggle.innerHTML = isPass ? EYE_OFF : EYE_OPEN;
    });

    // Demo form submission — routes to the dashboard
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('.btn-login');
      btn.textContent = 'Signing in…';
      btn.disabled = true;
      setTimeout(() => { window.location.href = 'admin-dashboard.html'; }, 700);
    });
  </script>
</body>
</html>
