<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Categories — Havenwood Admin</title>
  <meta name="description" content="Manage Havenwood product categories: create, edit, and organize collections." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ============================================================
       DESIGN TOKENS — identical to the rest of the admin & storefront
       ============================================================ */
    :root {
      --warm-white:#faf7f2; --cream:#f3eee6; --beige:#e8e0d3;
      --charcoal:#2b2926; --gray:#6f6a62;
      --wood:#a67c52; --sage:#6b7f5e; --sage-dark:#576a4c;
      --white:#fffdf9;
      --success:#6b7f5e; --warning:#c98a3a; --danger:#b3532e;
      --radius-lg:20px; --radius-md:12px; --radius-sm:8px; --radius-pill:999px;
      --shadow-soft:0 6px 24px rgba(43,41,38,.08);
      --shadow-lift:0 16px 40px rgba(43,41,38,.14);
      --sidebar-w:250px; --topbar-h:72px;
    }

    /* Reset & base */
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{min-height:100%}
    body{
      font-family:'Inter',sans-serif; background:var(--warm-white);
      color:var(--charcoal); -webkit-font-smoothing:antialiased; line-height:1.55;
    }
    h1,h2,h3{font-family:'Playfair Display',serif; line-height:1.2}
    a{color:inherit; text-decoration:none}
    button,input,select,textarea{font-family:inherit}
    img{display:block; max-width:100%}

    /* ============================================================
       APP SHELL (same as dashboard)
       ============================================================ */
    .app{display:grid; grid-template-columns:var(--sidebar-w) 1fr; min-height:100vh}

    .sidebar{
      background:var(--white); border-right:1px solid var(--beige);
      padding:24px 18px; position:sticky; top:0; height:100vh;
      display:flex; flex-direction:column;
    }
    .sidebar .brand{
      font-family:'Playfair Display',serif; font-size:24px; font-weight:700;
      padding:4px 8px 22px; border-bottom:1px solid var(--beige); margin-bottom:18px;
    }
    .sidebar .brand span{color:var(--sage)}
    .nav-label{
      font-size:11px; font-weight:600; letter-spacing:.14em;
      text-transform:uppercase; color:var(--gray); padding:6px 10px; margin-top:6px;
    }
    .side-nav{list-style:none; display:flex; flex-direction:column; gap:2px}
    .side-nav a{
      display:flex; align-items:center; gap:12px;
      padding:10px 12px; border-radius:var(--radius-md);
      color:var(--gray); font-size:14.5px; font-weight:500;
      transition:background .2s ease, color .2s ease, transform .15s ease;
    }
    .side-nav a:hover{background:var(--cream); color:var(--charcoal); transform:translateX(2px)}
    .side-nav a.active{background:var(--charcoal); color:var(--warm-white)}
    .side-nav a.active svg{color:var(--warm-white)}
    .side-nav svg{color:var(--gray); flex-shrink:0}
    .side-nav a:hover svg{color:var(--charcoal)}
    .sidebar-foot{margin-top:auto; padding-top:18px; border-top:1px solid var(--beige)}
    .sidebar-foot a.logout{color:var(--danger)}
    .sidebar-foot a.logout svg{color:var(--danger)}
    .sidebar-foot a.logout:hover{background:rgba(179,83,46,.08); color:var(--danger)}

    /* Main + topbar (same as dashboard) */
    .main-col{min-width:0}
    .topbar{
      position:sticky; top:0; z-index:40; height:var(--topbar-h);
      background:rgba(250,247,242,.85);
      backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
      border-bottom:1px solid var(--beige);
      display:flex; align-items:center; gap:20px; padding:0 32px;
    }
    .search{position:relative; flex:1; max-width:460px}
    .search svg{position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--gray)}
    .search input{
      width:100%; padding:10px 14px 10px 40px;
      border:1.5px solid var(--beige); border-radius:var(--radius-pill);
      background:var(--white); font-size:14px; color:var(--charcoal);
      transition:border-color .2s ease, box-shadow .2s ease;
    }
    .search input:focus{outline:none; border-color:var(--sage); box-shadow:0 0 0 4px rgba(107,127,94,.12)}
    .top-actions{margin-left:auto; display:flex; align-items:center; gap:12px}
    .icon-btn{
      position:relative; width:40px; height:40px;
      border-radius:var(--radius-pill); border:1.5px solid var(--beige);
      background:var(--white); color:var(--charcoal);
      display:grid; place-items:center; cursor:pointer;
      transition:background .2s ease, border-color .2s ease;
    }
    .icon-btn:hover{background:var(--cream); border-color:var(--charcoal)}
    .icon-btn .dot{
      position:absolute; top:8px; right:9px; width:8px; height:8px;
      background:var(--wood); border-radius:50%; border:2px solid var(--white);
    }
    .admin-chip{
      display:flex; align-items:center; gap:10px;
      padding:5px 14px 5px 5px; border-radius:var(--radius-pill);
      background:var(--white); border:1.5px solid var(--beige); cursor:pointer;
      transition:background .2s ease, border-color .2s ease;
    }
    .admin-chip:hover{background:var(--cream); border-color:var(--charcoal)}
    .admin-chip .avatar{
      width:32px; height:32px; border-radius:50%;
      background:var(--sage); color:var(--white);
      display:grid; place-items:center; font-weight:600; font-size:13px;
    }
    .admin-chip .who strong{display:block; font-size:13.5px; color:var(--charcoal)}
    .admin-chip .who span{display:block; font-size:11.5px; color:var(--gray)}

    /* Content wrapper */
    .content{padding:32px; display:flex; flex-direction:column; gap:28px}
    .page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap}
    .page-head h1{font-size:clamp(24px,3vw,32px); color:var(--charcoal)}
    .page-head p{color:var(--gray); font-size:14.5px; margin-top:4px}

    /* Shared pill buttons */
    .qa-btn{
      display:inline-flex; align-items:center; gap:8px;
      padding:10px 16px; border-radius:var(--radius-pill);
      border:1.5px solid var(--charcoal); background:transparent; color:var(--charcoal);
      font-size:13.5px; font-weight:600; cursor:pointer;
      transition:background .25s ease, color .25s ease, transform .15s ease;
    }
    .qa-btn:hover{background:var(--charcoal); color:var(--warm-white); transform:translateY(-1px)}
    .qa-btn.primary{background:var(--sage); border-color:var(--sage); color:var(--white)}
    .qa-btn.primary:hover{background:var(--sage-dark); border-color:var(--sage-dark)}

    /* ============================================================
       TOOLBAR (filter row above the grid)
       ============================================================ */
    .toolbar{
      display:flex; align-items:center; gap:12px; flex-wrap:wrap;
      background:var(--white); border:1px solid var(--beige);
      border-radius:var(--radius-lg); padding:14px 18px;
      box-shadow:var(--shadow-soft);
    }
    .toolbar .field{position:relative; flex:1; min-width:220px}
    .toolbar .field svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--gray)}
    .toolbar input, .toolbar select{
      width:100%; padding:10px 14px 10px 38px;
      border:1.5px solid var(--beige); border-radius:var(--radius-pill);
      background:var(--warm-white); font-size:14px; color:var(--charcoal);
      transition:border-color .2s ease, box-shadow .2s ease;
    }
    .toolbar select{padding-left:14px; appearance:none; cursor:pointer}
    .toolbar input:focus, .toolbar select:focus{
      outline:none; border-color:var(--sage); box-shadow:0 0 0 4px rgba(107,127,94,.12);
    }
    .toolbar .count{
      font-size:13px; color:var(--gray); margin-left:auto; white-space:nowrap;
    }
    .toolbar .count strong{color:var(--charcoal); font-weight:700}

    /* ============================================================
       CATEGORY GRID
       ============================================================ */
    .cat-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
      gap:22px;
    }

    .cat-card{
      background:var(--white); border:1px solid var(--beige);
      border-radius:var(--radius-lg); overflow:hidden;
      box-shadow:var(--shadow-soft);
      display:flex; flex-direction:column;
      transition:transform .25s ease, box-shadow .25s ease;
      opacity:0; transform:translateY(12px);
      animation:rise .55s ease forwards;
    }
    @keyframes rise{to{opacity:1; transform:translateY(0)}}
    .cat-card:hover{transform:translateY(-4px); box-shadow:var(--shadow-lift)}
    .cat-card:nth-child(1){animation-delay:.05s}
    .cat-card:nth-child(2){animation-delay:.10s}
    .cat-card:nth-child(3){animation-delay:.15s}
    .cat-card:nth-child(4){animation-delay:.20s}
    .cat-card:nth-child(5){animation-delay:.25s}
    .cat-card:nth-child(6){animation-delay:.30s}
    .cat-card:nth-child(7){animation-delay:.35s}
    .cat-card:nth-child(8){animation-delay:.40s}

    .cat-media{
      position:relative; aspect-ratio:16/10;
      background:var(--cream);
      overflow:hidden;
    }
    .cat-media img{
      width:100%; height:100%; object-fit:cover;
      transition:transform .5s ease;
    }
    .cat-card:hover .cat-media img{transform:scale(1.05)}

    /* Status pill sits on the image, upper-right */
    .cat-status{
      position:absolute; top:12px; right:12px;
      display:inline-flex; align-items:center; gap:6px;
      padding:5px 12px; border-radius:var(--radius-pill);
      font-size:11.5px; font-weight:600; letter-spacing:.02em;
      background:var(--white); color:var(--charcoal);
      box-shadow:0 2px 8px rgba(43,41,38,.12);
    }
    .cat-status .dot{width:7px; height:7px; border-radius:50%; background:var(--gray)}
    .cat-status.active{color:var(--sage-dark)}
    .cat-status.active .dot{background:var(--sage)}
    .cat-status.draft{color:var(--warning)}
    .cat-status.draft  .dot{background:var(--warning)}
    .cat-status.hidden{color:var(--gray)}

    .cat-body{padding:18px 20px 20px; display:flex; flex-direction:column; gap:10px}
    .cat-title{
      font-family:'Playfair Display',serif;
      font-size:20px; font-weight:600; color:var(--charcoal);
    }
    .cat-meta{
      display:flex; align-items:center; justify-content:space-between;
      gap:10px; font-size:13px; color:var(--gray);
    }
    .cat-meta .count-pill{
      display:inline-flex; align-items:center; gap:6px;
      background:var(--cream); color:var(--charcoal);
      padding:4px 10px; border-radius:var(--radius-pill);
      font-weight:600; font-size:12.5px;
    }
    .cat-meta .count-pill svg{color:var(--sage)}

    .cat-actions{
      display:flex; gap:8px; padding-top:12px;
      border-top:1px dashed var(--beige);
    }
    .cat-actions button{
      flex:1; display:inline-flex; align-items:center; justify-content:center; gap:6px;
      padding:9px 12px; font-size:13px; font-weight:600;
      border-radius:var(--radius-md); cursor:pointer;
      border:1.5px solid var(--beige); background:var(--warm-white); color:var(--charcoal);
      transition:background .2s ease, border-color .2s ease, color .2s ease, transform .15s ease;
    }
    .cat-actions button:hover{background:var(--charcoal); color:var(--warm-white); border-color:var(--charcoal); transform:translateY(-1px)}
    .cat-actions button.delete{color:var(--danger); border-color:rgba(179,83,46,.35)}
    .cat-actions button.delete:hover{background:var(--danger); color:var(--white); border-color:var(--danger)}

    /* ============================================================
       MODAL (Create / Edit category — visual only)
       ============================================================ */
    .modal-backdrop{
      position:fixed; inset:0; background:rgba(43,41,38,.55);
      backdrop-filter:blur(4px);
      display:none; align-items:center; justify-content:center;
      z-index:100; padding:20px;
      animation:fadeIn .25s ease;
    }
    .modal-backdrop.open{display:flex}
    @keyframes fadeIn{from{opacity:0} to{opacity:1}}

    .modal{
      background:var(--white); border-radius:var(--radius-lg);
      width:100%; max-width:480px;
      box-shadow:var(--shadow-lift);
      overflow:hidden;
      animation:pop .3s cubic-bezier(.2,.9,.3,1.2);
    }
    @keyframes pop{from{opacity:0; transform:translateY(10px) scale(.97)} to{opacity:1; transform:none}}

    .modal-head{
      padding:22px 24px 12px;
      display:flex; align-items:center; justify-content:space-between;
    }
    .modal-head h2{font-size:22px; color:var(--charcoal)}
    .modal-close{
      width:34px; height:34px; border-radius:50%;
      border:1.5px solid var(--beige); background:var(--warm-white);
      display:grid; place-items:center; cursor:pointer; color:var(--gray);
      transition:background .2s ease, color .2s ease;
    }
    .modal-close:hover{background:var(--charcoal); color:var(--white); border-color:var(--charcoal)}

    .modal-body{padding:8px 24px 20px; display:flex; flex-direction:column; gap:14px}
    .form-field label{
      display:block; font-size:12.5px; font-weight:600;
      letter-spacing:.05em; text-transform:uppercase; color:var(--gray);
      margin-bottom:6px;
    }
    .form-field input, .form-field select, .form-field textarea{
      width:100%; padding:11px 14px;
      border:1.5px solid var(--beige); border-radius:var(--radius-md);
      background:var(--warm-white); color:var(--charcoal); font-size:14px;
      transition:border-color .2s ease, box-shadow .2s ease;
    }
    .form-field textarea{resize:vertical; min-height:80px}
    .form-field input:focus, .form-field select:focus, .form-field textarea:focus{
      outline:none; border-color:var(--sage); box-shadow:0 0 0 4px rgba(107,127,94,.12);
    }
    .modal-foot{
      padding:16px 24px 22px; display:flex; gap:10px; justify-content:flex-end;
      background:var(--warm-white); border-top:1px solid var(--beige);
    }

    /* ============================================================
       TOAST (shared with storefront)
       ============================================================ */
    .toast{
      position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px);
      background:var(--charcoal); color:var(--warm-white);
      padding:12px 20px; border-radius:var(--radius-pill);
      font-size:14px; font-weight:500;
      box-shadow:var(--shadow-lift);
      opacity:0; pointer-events:none;
      transition:opacity .3s ease, transform .3s ease;
      z-index:200;
    }
    .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width:860px){
      .app{grid-template-columns:1fr}
      .sidebar{position:static; height:auto}
      .side-nav{flex-direction:row; overflow-x:auto; gap:6px}
      .side-nav a{white-space:nowrap}
      .nav-label, .sidebar-foot{display:none}
      .sidebar .brand{border-bottom:none; padding-bottom:12px; margin-bottom:8px}
      .topbar{padding:0 20px; gap:10px}
      .admin-chip .who{display:none}
      .content{padding:20px}
    }
    @media (max-width:520px){
      .search{max-width:none}
      .cat-actions{flex-direction:column}
    }
  </style>
</head>

            <input type="search" id="catSearch" placeholder="Search categories…" />
          </div>
          <div class="field" style="flex:0 0 180px; min-width:160px">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>
            <select id="statusFilter">
              <option value="all">All statuses</option>
              <option value="active">Active</option>
              <option value="draft">Draft</option>
              <option value="hidden">Hidden</option>
            </select>
          </div>
          <span class="count"><strong id="catCount">8</strong> categories</span>
        </section>

        <!-- Grid -->
        <section class="cat-grid" id="catGrid">
          <!-- Cards rendered by JS -->
        </section>

      </main>
    </div>
  </div>

  <!-- ============================================================
       MODAL (Create / Edit — visual only)
       ============================================================ -->
  <div class="modal-backdrop" id="modal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h2 id="modalTitle">Create category</h2>
        <button class="modal-close" id="modalClose" aria-label="Close">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-field">
          <label for="fName">Name</label>
          <input id="fName" type="text" placeholder="e.g. Sofas" />
        </div>
        <div class="form-field">
          <label for="fImage">Image URL</label>
          <input id="fImage" type="url" placeholder="https://…" />
        </div>
        <div class="form-field">
          <label for="fStatus">Status</label>
          <select id="fStatus">
            <option value="active">Active</option>
            <option value="draft">Draft</option>
            <option value="hidden">Hidden</option>
          </select>
        </div>
        <div class="form-field">
          <label for="fDesc">Short description</label>
          <textarea id="fDesc" placeholder="How you'd describe this collection to a shopper…"></textarea>
        </div>
      </div>
      <div class="modal-foot">
        <button class="qa-btn" id="modalCancel">Cancel</button>
        <button class="qa-btn primary" id="modalSave">Save category</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast">Saved</div>

  <script>
    /* ============================================================
       DATA — realistic demo categories
       ============================================================ */
    const categories = [
      { name:'Sofas',        count:28, status:'active', img:'https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=800&auto=format&fit=crop&q=70' },
      { name:'Tables',       count:22, status:'active', img:'https://images.unsplash.com/photo-1533090481720-856c6e3c1fdc?w=800&auto=format&fit=crop&q=70' },
      { name:'Chairs',       count:34, status:'active', img:'https://images.unsplash.com/photo-1519947486511-46149fa0a254?w=800&auto=format&fit=crop&q=70' },
      { name:'Lighting',     count:19, status:'active', img:'https://images.unsplash.com/photo-1524634126442-357e0eac3c14?w=800&auto=format&fit=crop&q=70' },
      { name:'Rugs & Textiles', count:16, status:'active', img:'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=800&auto=format&fit=crop&q=70' },
      { name:'Storage',      count:12, status:'draft',  img:'https://images.unsplash.com/photo-1594026112284-02bb6f3352fe?w=800&auto=format&fit=crop&q=70' },
      { name:'Décor',        count:41, status:'active', img:'https://images.unsplash.com/photo-1513694203232-719a280e022f?w=800&auto=format&fit=crop&q=70' },
      { name:'Outdoor',      count:8,  status:'hidden', img:'https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?w=800&auto=format&fit=crop&q=70' },
    ];

    /* ============================================================
       RENDER
       ============================================================ */
    const grid = document.getElementById('catGrid');
    const countEl = document.getElementById('catCount');
    const search = document.getElementById('catSearch');
    const statusFilter = document.getElementById('statusFilter');

    function statusLabel(s){
      if(s==='active') return 'Active';
      if(s==='draft')  return 'Draft';
      return 'Hidden';
    }

    function render(){
      const q = search.value.trim().toLowerCase();
      const s = statusFilter.value;
      const list = categories.filter(c => {
        const matchQ = !q || c.name.toLowerCase().includes(q);
        const matchS = s==='all' || c.status===s;
        return matchQ && matchS;
      });

      countEl.textContent = list.length;

      grid.innerHTML = list.map((c,i) => `
        <article class="cat-card" style="animation-delay:${(i*0.05).toFixed(2)}s">
          <div class="cat-media">
            <img src="${c.img}" alt="${c.name} category" loading="lazy" />
            <span class="cat-status ${c.status}">
              <span class="dot"></span> ${statusLabel(c.status)}
            </span>
          </div>
          <div class="cat-body">
            <h3 class="cat-title">${c.name}</h3>
            <div class="cat-meta">
              <span class="count-pill">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
                ${c.count} products
              </span>
              <span>Updated recently</span>
            </div>
            <div class="cat-actions">
              <button data-action="edit" data-name="${c.name}">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                Edit
              </button>
              <button class="delete" data-action="delete" data-name="${c.name}">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="m19 6-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
                Delete
              </button>
            </div>
          </div>
        </article>
      `).join('');
    }

    /* ============================================================
       ACTIONS — edit / delete (visual only + toast)
       ============================================================ */
    grid.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-action]');
      if(!btn) return;
      const name = btn.dataset.name;
      if(btn.dataset.action === 'edit'){
        openModal('Edit category', name);
      } else {
        // Simple confirm-then-remove flow
        if(confirm(`Delete the "${name}" category? This cannot be undone.`)){
          const idx = categories.findIndex(c => c.name === name);
          if(idx > -1) categories.splice(idx, 1);
          render();
          toast(`"${name}" deleted`);
        }
      }
    });

    /* ============================================================
       MODAL — create / edit (visual only)
       ============================================================ */
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modalTitle');
    const fName = document.getElementById('fName');
    const fImage = document.getElementById('fImage');
    const fStatus = document.getElementById('fStatus');
    const fDesc = document.getElementById('fDesc');

    function openModal(title, name){
      modalTitle.textContent = title;
      const existing = name ? categories.find(c => c.name === name) : null;
      fName.value  = existing ? existing.name  : '';
      fImage.value = existing ? existing.img   : '';
      fStatus.value= existing ? existing.status: 'active';
      fDesc.value  = '';
      modal.classList.add('open');
    }
    function closeModal(){ modal.classList.remove('open'); }

    document.getElementById('openCreate').addEventListener('click', () => openModal('Create category'));
    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('modalCancel').addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => { if(e.target === modal) closeModal(); });
    document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeModal(); });

    document.getElementById('modalSave').addEventListener('click', () => {
      const name = fName.value.trim();
      if(!name){ toast('Please enter a name'); return; }
      const img = fImage.value.trim() || 'https://images.unsplash.com/photo-1493663284031-b7e3aefcae8e?w=800&auto=format&fit=crop&q=70';
      const status = fStatus.value;

      const existing = categories.find(c => c.name.toLowerCase() === name.toLowerCase());
      if(existing){
        existing.img = img;
        existing.status = status;
        toast(`"${name}" updated`);
      } else {
        categories.unshift({ name, img, status, count:0 });
        toast(`"${name}" created`);
      }
      closeModal();
      render();
    });

    /* ============================================================
       FILTERS
       ============================================================ */
    search.addEventListener('input', render);
    statusFilter.addEventListener('change', render);

    /* ============================================================
       TOAST
       ============================================================ */
    let toastTimer;
    function toast(msg){
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
    }

    // Initial paint
    render();
  </script>
</body>
</html>
