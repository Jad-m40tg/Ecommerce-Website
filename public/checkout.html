  <link rel="preconnect" href="https://fonts.googleapis.com" />

<body>

      <a href="althome.html" class="brand"><img src="/assets/Boularas_Logo.png" alt="Boularas logo" class="brand-logo" /></a>

          <li><a href="products.html">Shop</a></li>

        </ul>

      <div class="navbar-actions">
        <a href="search-results.html" class="nav-search" aria-label="Search products"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></a>
        <a href="wishlist.html" class="nav-wish" aria-label="Wishlist"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></a>
        <a href="cart.html" class="cart-btn" aria-label="Shopping cart">
          <span class="cart-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg></span><span class="cart-label">Cart</span> <span class="cart-count" id="cartCount">0</span>
        </a>
        <button class="menu-toggle" id="menuToggle" type="button" aria-label="Toggle menu">&#9776;</button>
      </div>

  <main>

    <!-- ==========================================================
         BREADCRUMB
         ========================================================== -->
    <div class="container">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="althome.html">Home</a>
        <span class="sep">/</span>
        <a href="products.html">Shop</a>
        <span class="sep">/</span>
        <a href="cart.html">Cart</a>
        <span class="sep">/</span>
        <span class="current">Checkout</span>
      </nav>
    </div>

    <!-- ==========================================================
         PAGE HEAD
         ========================================================== -->
    <div class="container page-head">
      <h1>Checkout</h1>
      <p id="pageSubtitle">Complete your order.</p>
    </div>

    <!-- ==========================================================
         CHECKOUT LAYOUT
         ========================================================== -->
    <div class="container">
      <div class="checkout-layout">

        <!-- Left â€” Form -->
        <div class="checkout-form reveal">

          <!-- Contact -->
          <section class="form-section" id="contactSection">
            <h2>Contact</h2>
            <div class="form-row full">
              <div class="field">
                <label for="email">Email <span class="required">*</span></label>
                <input type="email" id="email" placeholder="you@example.com" required />
                <div class="error-msg" id="emailError">Please enter a valid email.</div>
              </div>
            </div>
            <div class="form-row">
              <div class="field">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" placeholder="0555 12 34 56" />
              </div>
            </div>
          </section>

          <!-- Shipping -->
          <section class="form-section" id="shippingSection">
            <h2>Shipping Address</h2>
            <div class="form-row">
              <div class="field">
                <label for="firstName">First Name <span class="required">*</span></label>
                <input type="text" id="firstName" placeholder="Jane" required />
                <div class="error-msg" id="firstNameError">Required.</div>
              </div>
              <div class="field">
                <label for="lastName">Last Name <span class="required">*</span></label>
                <input type="text" id="lastName" placeholder="Doe" required />
                <div class="error-msg" id="lastNameError">Required.</div>
              </div>
            </div>
            <div class="form-row full">
              <div class="field">
                <label for="address">Address <span class="required">*</span></label>
                <input type="text" id="address" placeholder="Rue Didouche Mourad" required />
                <div class="error-msg" id="addressError">Required.</div>
              </div>
            </div>
            <div class="form-row full">
              <div class="field">
                <label for="apt">Apartment, suite, etc. (optional)</label>
                <input type="text" id="apt" placeholder="Appartement (optionnel)" />
              </div>
            </div>
            <div class="form-row full">
              <div class="field">
                <label for="city">City (Wilaya) <span class="required">*</span></label>
                <input type="text" id="city" placeholder="Algiers" required />
                <div class="error-msg" id="cityError">Required.</div>
              </div>
            </div>
          </section>

          <!-- Payment -->
          <section class="form-section" id="paymentSection">
            <h2>Payment Method</h2>
            <div class="form-row full">
              <div class="field">
                <label>Choose how you'd like to pay</label>
                <div style="display:flex;flex-direction:column;gap:12px;margin-top:8px">
                  <label style="display:flex;align-items:center;gap:12px;padding:16px;border:2px solid var(--beige);border-radius:12px;cursor:pointer;transition:border-color .2s">
                    <input type="radio" name="payment_method" value="cash_on_delivery" checked style="width:18px;height:18px;accent-color:var(--sage)" />
                    <div>
                      <strong style="font-size:15px">Cash on Delivery</strong>
                      <div style="font-size:13px;color:var(--gray);margin-top:2px">Pay with cash when your order arrives. Available in all wilayas.</div>
                    </div>
                  </label>
                  <label style="display:flex;align-items:center;gap:12px;padding:16px;border:2px solid var(--beige);border-radius:12px;cursor:pointer;transition:border-color .2s">
                    <input type="radio" name="payment_method" value="card" style="width:18px;height:18px;accent-color:var(--sage)" />
                    <div>
                      <strong style="font-size:15px">Pay Now — CIB / Edahabia / BaridiMob</strong>
                      <div style="font-size:13px;color:var(--gray);margin-top:2px">You'll be redirected to Chargily to complete the payment securely.</div>
                    </div>
                  </label>
                </div>
              </div>
            </div>
          </section>

        </div>

        <!-- Right â€” Summary -->
        <aside class="summary reveal" id="summaryPanel">
          <!-- Rendered by JS -->
        </aside>

      </div>
    </div>

  </main>

  <!-- Toast -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="utils.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
