  <link rel="stylesheet" href="css/buttons.css?v=22" />
  <link rel="stylesheet" href="css/footer.css?v=22" />
  <link rel="stylesheet" href="css/reveal.css?v=22" />
  <link rel="stylesheet" href="css/toast.css?v=22" />
  <link rel="stylesheet" href="css/skeleton.css?v=22" />
  <link rel="stylesheet" href="css/shared-responsive.css?v=24" />
  <link rel="stylesheet" href="css/checkout.css?v=25" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css?v=22" />
</head>
<body>

  <a class="skip-link" href="#main" data-i18n="common:skip_to_content">Skip to content</a>

  <!-- ==========================================================
       NAVBAR - identical to sibling pages
       ========================================================== -->
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="brand"><img src="/assets/Boularas_Logo.png" alt="Boularas logo" data-i18n-attr="alt:customer:nav.brand_alt" class="brand-logo" /></a>

      <nav aria-label="Main navigation" data-i18n-attr="aria-label:customer:nav.main_nav_aria">
        <ul class="nav-links" id="navLinks">
          <li><a href="index.html" data-i18n="customer:nav.home">Home</a></li>
          <li><a href="products.html" data-i18n="customer:nav.shop">Shop</a></li>
          <li><a href="categories.html" data-i18n="customer:nav.categories">Categories</a></li>
          <li><a href="offers.html" data-i18n="customer:nav.offers">Offers</a></li>
        </ul>
      </nav>

      <div class="navbar-actions">
        <a href="search-results.html" class="nav-search" aria-label="Search products" data-i18n-attr="aria-label:customer:nav.search_aria"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></a>
        <a href="wishlist.html" class="nav-wish" aria-label="Wishlist" data-i18n-attr="aria-label:customer:nav.wishlist_aria"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span class="wish-count" id="wishCount">0</span></a>
        <a href="cart.html" class="cart-btn" aria-label="Shopping cart" data-i18n-attr="aria-label:customer:nav.cart_aria">
          <span class="cart-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg></span><span class="cart-label" data-i18n="customer:nav.cart">Cart</span> <span class="cart-count" id="cartCount">0</span>
        </a>
        <button class="menu-toggle" data-i18n-attr="aria-label:customer:nav.toggle_aria" id="menuToggle" type="button" aria-label="Toggle menu">&#9776;</button>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1">

    <!-- ==========================================================
         BREADCRUMB
         ========================================================== -->
    <div class="container">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html" data-i18n="customer:nav.home">Home</a>
        <span class="sep">/</span>
        <a href="products.html" data-i18n="customer:nav.shop">Shop</a>
        <span class="sep">/</span>
        <a href="cart.html" data-i18n="customer:nav.cart">Cart</a>
        <span class="sep">/</span>
        <span class="current" data-i18n="customer:checkout.title_h1">Checkout</span>
      </nav>
    </div>

    <!-- ==========================================================
         PAGE HEAD
         ========================================================== -->
    <div class="container page-head">
      <h1 data-i18n="customer:checkout.title_h1">Checkout</h1>
      <p id="pageSubtitle" data-i18n="customer:checkout.subtitle_default">Complete your order.</p>
    </div>

    <!-- ==========================================================
         CHECKOUT LAYOUT
         ========================================================== -->
    <div class="container">
      <div class="checkout-layout">

        <!-- Left - Form -->
        <div class="checkout-form reveal">

          <!-- Contact -->
          <section class="form-section" id="contactSection">
            <h2 data-i18n="customer:checkout.contact">Contact</h2>
            <div class="form-row full">
              <div class="field">
                <label for="email"><span data-i18n="customer:checkout.email">Email</span> <span class="required">*</span></label>
                <span class="input-wrap"><input type="email" id="email" placeholder="you@example.com" data-i18n-attr="placeholder:customer:checkout.email" required />
                <i class="fa-solid fa-circle-check validation-icon"></i></span>
                <div class="error-msg" id="emailError" role="alert" data-i18n="customer:checkout.err_email">Please enter a valid email.</div>
              </div>
            </div>
            <div class="form-row">
              <div class="field">
                <label for="phone"><span data-i18n="customer:checkout.phone">Phone</span> <span class="required">*</span></label>
                <span class="input-wrap"><input type="tel" id="phone" placeholder="0555 12 34 56" data-i18n-attr="placeholder:customer:checkout.phone" />
                <i class="fa-solid fa-circle-check validation-icon"></i></span>
                <div class="error-msg" id="phoneError" role="alert"></div>
              </div>
            </div>
          </section>

          <!-- Shipping -->
          <section class="form-section" id="shippingSection">
            <h2 data-i18n="customer:checkout.shipping_address">Shipping Address</h2>
            <div class="form-row">
              <div class="field">
                <label for="firstName"><span data-i18n="customer:checkout.first_name">First Name</span> <span class="required">*</span></label>
                <span class="input-wrap"><input type="text" id="firstName" placeholder="Jane" data-i18n-attr="placeholder:customer:checkout.first_name" required />
                <i class="fa-solid fa-circle-check validation-icon"></i></span>
                <div class="error-msg" id="firstNameError" role="alert" data-i18n="customer:checkout.required">Required.</div>
              </div>
              <div class="field">
                <label for="lastName"><span data-i18n="customer:checkout.last_name">Last Name</span> <span class="required">*</span></label>
                <span class="input-wrap"><input type="text" id="lastName" placeholder="Doe" data-i18n-attr="placeholder:customer:checkout.last_name" required />
                <i class="fa-solid fa-circle-check validation-icon"></i></span>
                <div class="error-msg" id="lastNameError" role="alert" data-i18n="customer:checkout.required">Required.</div>
              </div>
            </div>
            <div class="form-row full">
              <div class="field">
                <label for="address"><span data-i18n="customer:checkout.address">Address</span> <span class="required">*</span></label>
                <span class="input-wrap"><input type="text" id="address" placeholder="Rue Didouche Mourad" data-i18n-attr="placeholder:customer:checkout.address" required />
                <i class="fa-solid fa-circle-check validation-icon"></i></span>
                <div class="error-msg" id="addressError" role="alert" data-i18n="customer:checkout.required">Required.</div>
              </div>
            </div>
            <div class="form-row full">
              <div class="field">
                <label for="apt" data-i18n="customer:checkout.apt">Apartment, suite, etc. (optional)</label>
                <input type="text" id="apt" placeholder="Appartement (optionnel)" data-i18n-attr="placeholder:customer:checkout.apt" />
              </div>
            </div>
            <div class="form-row full">
              <div class="field">
                <label for="city"><span data-i18n="customer:checkout.city_wilaya">City (Wilaya)</span> <span class="required">*</span></label>
                <span class="input-wrap"><input type="text" id="city" placeholder="Algiers" data-i18n-attr="placeholder:customer:checkout.city_wilaya" required />
                <i class="fa-solid fa-circle-check validation-icon"></i></span>
                <div class="error-msg" id="cityError" role="alert" data-i18n="customer:checkout.required">Required.</div>
              </div>
            </div>
          </section>

          <!-- Payment -->
          <section class="form-section" id="paymentSection">
            <h2 data-i18n="customer:checkout.payment_method">Payment Method</h2>
            <div class="form-row full">
              <div class="field">
                <label data-i18n="customer:checkout.choose_payment">Choose how you'd like to pay</label>
                <div style="display:flex;flex-direction:column;gap:12px;margin-top:8px">
                  <label style="display:flex;align-items:center;gap:12px;padding:16px;border:2px solid var(--beige);border-radius:12px;cursor:pointer;transition:border-color .2s">
                    <input type="radio" name="payment_method" value="cash_on_delivery" checked style="width:18px;height:18px;accent-color:var(--sage)" />
                    <div>
                      <strong style="font-size:15px" data-i18n="customer:checkout.cod_title">Cash on Delivery</strong>
                      <div style="font-size:13px;color:var(--gray);margin-top:2px" data-i18n="customer:checkout.cod_sub">Pay with cash when your order arrives. Available in all wilayas.</div>
                    </div>
                  </label>
                  <label style="display:flex;align-items:center;gap:12px;padding:16px;border:2px solid var(--beige);border-radius:12px;cursor:pointer;transition:border-color .2s">
                    <input type="radio" name="payment_method" value="card" style="width:18px;height:18px;accent-color:var(--sage)" />
                    <div>
                      <strong style="font-size:15px" data-i18n="customer:checkout.card_title">Pay Now: CIB / Edahabia / BaridiMob</strong>
                      <div style="font-size:13px;color:var(--gray);margin-top:2px" data-i18n="customer:checkout.card_sub">You'll be redirected to Chargily to complete the payment securely.</div>
                    </div>
                  </label>
                </div>
              </div>
            </div>
          </section>

        </div>

        <!-- Right - Summary -->
        <aside class="summary reveal" id="summaryPanel">
          <!-- Rendered by JS -->
        </aside>

      </div>
    </div>

  </main>

  <!-- Toast -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="utils.js?v=22"></script>
  <script src="js/footer.js?v=22"></script>
  <script src="js/cart-utils.js?v=22"></script>
  <script src="js/checkout.js?v=23"></script>
  <script src="js/language.js?v=23"></script>
  <script src="js/vendor/i18next.min.js"></script>
  <script src="js/vendor/i18next-http-backend.min.js"></script>
  <script src="js/i18n-init.js?v=1"></script>
  <script src="js/i18n-helper.js?v=1"></script>
</body>
</html>
