  <meta property="og:description" content="Order confirmation for your Boularas purchase." data-i18n-attr="content:customer:payment_page.order_placed_desc" />

  <meta property="og:image" content="/assets/Boularas_Logo.png" />

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    .success-page{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;overflow-x:hidden}
    .success-card{max-width:480px;width:100%;text-align:center;background:var(--white);border:1px solid var(--beige);border-radius:var(--radius-lg);padding:48px 36px;box-shadow:var(--shadow-soft);box-sizing:border-box}
    .success-icon{width:72px;height:72px;border-radius:50%;background:rgba(107,127,94,.12);color:var(--sage);display:grid;place-items:center;margin:0 auto 20px;font-size:52px;font-weight:700;overflow:visible}
    .success-icon.danger{background:var(--cream);color:var(--danger)}
    .success-icon.warning{border-radius:var(--radius-md)}
    .success-icon .material-symbols-outlined{font-size:inherit !important}
    .success-card h1{font-family:'Inter',sans-serif !important;font-weight:500;font-size:28px;margin-bottom:8px}
    .success-card p{color:var(--gray);font-size:15px;line-height:1.6}
    .tracking-code{display:inline-block;margin:20px 0;padding:12px 24px;background:var(--cream);border:1px solid var(--beige);border-radius:var(--radius-md);font-family:monospace;font-size:20px;font-weight:700;letter-spacing:2px;color:var(--charcoal)}
    .success-actions{display:flex;gap:12px;justify-content:center;margin-top:28px;flex-wrap:wrap}
    .spinner-lg{width:32px;height:32px;border:3px solid var(--beige);border-top-color:var(--sage);border-radius:50%;animation:spin .8s linear infinite;margin:20px auto}
    @keyframes spin{to{transform:rotate(360deg)}}
    .call-note{background:var(--cream);border:1px solid var(--beige);border-radius:var(--radius-md);padding:14px 18px;margin-top:16px;font-size:14px;color:var(--charcoal)}
    .call-note a{color:var(--sage);font-weight:600;text-decoration:none}
    .call-note a:hover{text-decoration:underline}
    .wait-badge{display:inline-flex;align-items:center;gap:8px;margin:20px 0;padding:10px 18px;background:var(--cream);border:1px solid var(--beige);border-radius:var(--radius-pill);font-size:14px;font-weight:600;color:var(--gray)}
    .wait-badge .spinner-sm{width:14px;height:14px;border:2px solid var(--beige);border-top-color:var(--sage);border-radius:50%;animation:spin .8s linear infinite}
    .cancelled-badge{display:inline-flex;align-items:center;gap:8px;margin:14px 0;padding:10px 18px;background:rgba(179,83,46,.1);border:1px solid rgba(179,83,46,.25);border-radius:var(--radius-pill);font-size:14px;font-weight:600;color:var(--danger)}
    @media(max-width:500px){.success-page{padding:24px 14px;overflow-x:hidden}.success-card{padding:28px 18px;box-sizing:border-box}.success-card h1{font-size:22px}.tracking-code{font-size:16px;padding:10px 16px;letter-spacing:1px}}
  </style>
</head>
<body style="overflow-x:hidden">
  <a class="skip-link" href="#main" data-i18n="common:skip_to_content">Skip to content</a>
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="brand"><img src="/assets/Boularas_Logo.png" alt="Boularas logo" data-i18n-attr="alt:customer:nav.brand_alt" class="brand-logo" /></a>
      <nav aria-label="Main navigation" data-i18n-attr="aria-label:customer:nav.main_nav_aria">
        <ul class="nav-links" id="navLinks">
          <li><a href="index.html" data-i18n="customer:nav.home">Home</a></li>
          <li><a href="products.html" data-i18n="customer:nav.shop">Shop</a></li>
          <li><a href="categories.html" data-i18n="customer:nav.categories">Categories</a></li>
          <li><a href="offers.html" data-i18n="customer:nav.offers">Offers</a></li>
        </ul>
      </nav>
      <div class="navbar-actions">
        <a href="search-results.html" class="nav-search" aria-label="Search" data-i18n-attr="aria-label:customer:nav.search_aria"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></a>
        <a href="wishlist.html" class="nav-wish" aria-label="Wishlist" data-i18n-attr="aria-label:customer:nav.wishlist_aria"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span class="wish-count" id="wishCount">0</span></a>
        <a href="cart.html" class="cart-btn" aria-label="Cart" data-i18n-attr="aria-label:customer:nav.cart_aria"><span class="cart-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg></span><span class="cart-label" data-i18n="customer:nav.cart">Cart</span> <span class="cart-count" id="cartCount">0</span></a>
        <button class="menu-toggle" data-i18n-attr="aria-label:customer:nav.toggle_aria" id="menuToggle" type="button" aria-label="Toggle menu">&#9776;</button>
      </div>
    </div>

  <main class="success-page" id="main" tabindex="-1">
    <div class="success-card" id="successContent" role="status" aria-live="polite">
      <div class="spinner-lg" id="loadingSpinner"></div>
      <p id="loadingText" style="margin-top:12px" data-i18n="customer:payment_page.loading_order">Loading your order...</p>
    </div>
  </main>

  <script src="utils.js?v=22"></script>
  <script src="js/cart-utils.js?v=22"></script>
  <script>updateCartCount();</script>
  <script>
    (function () {
      var toggle = document.getElementById('menuToggle');
      var navLinks = document.getElementById('navLinks');
      if (!toggle || !navLinks) return;
      toggle.setAttribute('aria-expanded', 'false');
      toggle.addEventListener('click', function () {
        var open = navLinks.classList.toggle('open');
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
    })();
  </script>
  <script>
    (function () {
      function t(key, params) { return (window.i18n) ? window.i18n(key.trim(), params) : key.trim(); }
      var pollInterval = null;
      function boot() {
      if (pollInterval) clearInterval(pollInterval);
      var params = new URLSearchParams(window.location.search);
      var orderId = params.get('order_id');
      var code = params.get('code');
      var content = document.getElementById('successContent');

      function setContent(html) {
        content.innerHTML = html;
        // No .focus() on the heading: iOS/Safari draws a focus ring around it
        // (the "doubled border" look). #successContent has role="status" +
        // aria-live="polite", so screen readers still announce updates.
      }

      if (!orderId || !code) {
        setContent('<div class="success-icon">?</div><h1>' + t('customer:payment_page.invalid_title') + '</h1><p>' + t('customer:payment_page.invalid_desc') + '</p><div class="success-actions"><a href="products.html" class="btn btn-primary">' + t('customer:payment_page.continue_shopping') + '</a></div>');
        return;
      }

      var attempts = 0;
      var maxAttempts = 150;
      var storePhone = '';

      function phoneHref(p) { return 'tel:+' + String(p).replace(/\D/g, ''); }

      function waitingHtml() {
        return '<div class="success-icon"><span class="material-symbols-outlined">schedule</span></div><h1>' + t('customer:payment_page.order_confirmed_title') + '</h1><p>' + t('customer:payment_page.order_placed_desc') + '</p>' +
          '<div class="wait-badge"><span class="spinner-sm"></span>' + t('customer:payment_page.waiting_code_badge') + '</div>' +
          (storePhone ? '<div class="call-note">' + t('customer:payment_page.questions_call') + ' <a href="' + phoneHref(storePhone) + '">' + storePhone + '</a></div>' : '') +
          '<div class="success-actions"><a href="products.html" class="btn btn-primary">' + t('customer:payment_page.continue_shopping') + '</a></div>';
      }

      setContent(waitingHtml());

      fetch('/api/settings').then(function (r) { return r.json(); }).then(function (s) {
        storePhone = s.contact_phone || '';
        // The card was drawn before this fetch resolved, so if the number is
        // still missing and the user is still on the waiting view, redraw it
        // now that the store phone is known.
        var live = content.querySelector('.wait-badge');
        if (storePhone && live && !content.querySelector('.call-note')) {
          setContent(waitingHtml());
        }
      }).catch(function () {});
      pollInterval = setInterval(function () {
        attempts++;
        if (attempts > maxAttempts) {
          clearInterval(pollInterval);
          setContent('<div class="success-icon"><span class="material-symbols-outlined">check_circle</span></div><h1>' + t('customer:payment_page.order_confirmed_title') + '</h1><p>' + t('customer:payment_page.order_placed_desc_timeout') + '</p>' +
            (storePhone ? '<div class="call-note">' + t('customer:payment_page.questions_call') + ' <a href="' + phoneHref(storePhone) + '">' + storePhone + '</a></div>' : '') +
            '<div class="success-actions"><button type="button" class="btn btn-outline" onclick="location.reload()">' + t('customer:payment_page.check_again') + '</button><a href="products.html" class="btn btn-primary">' + t('customer:payment_page.continue_shopping') + '</a></div>');
          return;
        }

        fetch('/api/orders/track?code=' + encodeURIComponent(code)).then(function (r) { return r.json(); }).then(function (data) {
          if (!data.order) return;
          var order = data.order;
          var orderCancelled = order.order_status === 'cancelled';
          var noestCancelled = order.noest_status === 'CANCELLED';
          var surfaced = order.tracking_code || '';
          var noestArrived = surfaced && surfaced.toUpperCase() !== code.toUpperCase();

          if (orderCancelled) {
            clearInterval(pollInterval);
            setContent('<div class="success-icon danger"><span class="material-symbols-outlined">cancel</span></div><h1>' + t('customer:payment_page.order_cancelled_title') + '</h1><p>' + t('customer:payment_page.order_cancelled_desc') + '</p>' +
              '<div class="cancelled-badge">' + t('customer:payment_page.order_cancelled_badge') + '</div>' +
              (storePhone ? '<div class="call-note">' + t('customer:payment_page.contact_details') + ' <a href="' + phoneHref(storePhone) + '">' + storePhone + '</a></div>' : '') +
              '<div class="success-actions"><a href="products.html" class="btn btn-primary">' + t('customer:payment_page.continue_shopping') + '</a></div>');
          } else if (noestArrived) {
            clearInterval(pollInterval);
            setContent('<div class="success-icon"><span class="material-symbols-outlined">check_circle</span></div><h1>' + t('customer:payment_page.order_confirmed_title') + '</h1><p>' + t('customer:payment_page.order_thankyou_desc') + '</p>' +
              '<div class="tracking-code">' + escapeHtml(surfaced) + '</div><p style="font-size:13px;color:var(--gray)">' + t('customer:payment_page.tracking_hint') + '</p>' +
              (storePhone ? '<div class="call-note">' + t('customer:payment_page.questions_call') + ' <a href="' + phoneHref(storePhone) + '">' + storePhone + '</a></div>' : '') +
              '<div class="success-actions"><a href="track.html?code=' + encodeURIComponent(surfaced) + '" class="btn btn-primary">' + t('customer:payment_page.track_order') + '</a><a href="products.html" class="btn btn-outline">' + t('customer:payment_page.continue_shopping') + '</a></div>');
          } else if (noestCancelled) {
            clearInterval(pollInterval);
            setContent('<div class="success-icon danger warning"><span class="material-symbols-outlined">warning</span></div><h1>' + t('customer:payment_page.shipment_cancelled_order_title') + '</h1><p>' + t('customer:payment_page.shipment_cancelled_order_desc') + '</p>' +
              '<div class="cancelled-badge">' + t('customer:payment_page.shipment_cancelled_badge') + '</div>' +
              (storePhone ? '<div class="call-note">' + t('customer:payment_page.contact_details') + ' <a href="' + phoneHref(storePhone) + '">' + storePhone + '</a></div>' : '') +
              '<div class="success-actions"><a href="products.html" class="btn btn-primary">' + t('customer:payment_page.continue_shopping') + '</a></div>');
          }
        }).catch(function () {});
      }, 2000);
      }
      if (window.i18n) boot();
      else window.addEventListener('i18n:ready', function () { boot(); }, { once: true });
      window.addEventListener('i18n:changed', function () { boot(); });
    })();
  </script>
  <script src="js/language.js?v=23"></script>

  <script src="js/vendor/i18next-http-backend.min.js"></script>
  <script src="js/i18n-init.js?v=1"></script>
  <script src="js/i18n-helper.js?v=1"></script>
</body>
</html>
