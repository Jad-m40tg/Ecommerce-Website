<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title data-i18n="customer:payment_page.failed_meta_title">Payment Failed | Boularas</title>
  <meta name="description" content="Payment was not completed - please try again." data-i18n-attr="content:customer:payment_page.failed_meta_desc" />
  <meta property="og:title" content="Payment Failed | Boularas" data-i18n-attr="content:customer:payment_page.failed_meta_title" />
  <meta property="og:description" content="Payment was not completed - please try again." data-i18n-attr="content:customer:payment_page.failed_meta_desc" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/assets/Boularas_Logo.png" />
  <meta name="twitter:card" content="summary" />
  <link rel="canonical" href="payment-failed.html" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <link rel="stylesheet" href="css/global.css?v=23" />
  <link rel="stylesheet" href="css/base.css?v=24" />
  <link rel="stylesheet" href="css/navbar.css?v=26" />
  <link rel="stylesheet" href="css/buttons.css?v=22" />
  <link rel="stylesheet" href="css/shared-responsive.css?v=22" />
  <style>
    .fail-page{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;overflow-x:hidden}
    .fail-card{max-width:480px;width:100%;text-align:center;background:var(--white);border:1px solid var(--beige);border-radius:var(--radius-lg);padding:48px 36px;box-shadow:var(--shadow-soft);box-sizing:border-box}
    .fail-icon{width:72px;height:72px;border-radius:50%;background:rgba(179,83,46,.10);color:var(--danger);display:grid;place-items:center;margin:0 auto 20px}
    .fail-icon .material-symbols-outlined{font-size:36px;color:var(--danger)}
    .fail-card h1{font-family:'Inter',sans-serif !important;font-weight:500;font-size:28px;margin-bottom:8px}
    .fail-card p{color:var(--gray);font-size:15px;line-height:1.6}
    .fail-actions{display:flex;gap:12px;justify-content:center;margin-top:28px;flex-wrap:wrap}
    @media(max-width:500px){.fail-page{padding:24px 14px;overflow-x:hidden}.fail-card{padding:28px 18px;box-sizing:border-box}.fail-card h1{font-size:22px}}
  </style>
</head>
<body style="overflow-x:hidden">
  <a class="skip-link" href="#main" data-i18n="common:skip_to_content">Skip to content</a>
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="brand"><img src="/assets/Boularas_Logo.png" alt="Boularas logo" class="brand-logo" data-i18n-attr="alt:customer:nav.brand_alt" /></a>
      <nav aria-label="Main navigation" data-i18n-attr="aria-label:customer:nav.main_nav_aria">
        <ul class="nav-links" id="navLinks">
          <li><a href="index.html" data-i18n="customer:nav.home">Home</a></li>
          <li><a href="products.html" data-i18n="customer:nav.shop">Shop</a></li>
          <li><a href="categories.html" data-i18n="customer:nav.categories">Categories</a></li>
          <li><a href="offers.html" data-i18n="customer:nav.offers">Offers</a></li>
        </ul>
      </nav>
      <div class="navbar-actions">
        <a href="search-results.html" class="nav-search" aria-label="Search" data-i18n-attr="aria-label:customer:nav.search_aria"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></a>
        <a href="wishlist.html" class="nav-wish" aria-label="Wishlist" data-i18n-attr="aria-label:customer:nav.wishlist_aria"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span class="wish-count" id="wishCount">0</span></a>
        <a href="cart.html" class="cart-btn" aria-label="Cart" data-i18n-attr="aria-label:customer:nav.cart_aria"><span class="cart-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg></span><span class="cart-label" data-i18n="customer:nav.cart">Cart</span> <span class="cart-count" id="cartCount">0</span></a>
        <button class="menu-toggle" id="menuToggle" type="button" aria-label="Toggle menu" data-i18n-attr="aria-label:customer:nav.toggle_aria">&#9776;</button>
      </div>
    </div>
  </header>

  <main class="fail-page" id="main" tabindex="-1">
    <div class="fail-card">
      <div class="fail-icon"><span class="material-symbols-outlined">cancel</span></div>
      <h1 data-i18n="customer:payment_page.failed_title">Payment Failed</h1>
      <p data-i18n="customer:payment_page.failed_desc">Unfortunately, your payment could not be processed. Your order has not been placed. Please try again or choose a different payment method.</p>
      <div class="fail-actions">
        <a href="cart.html" class="btn btn-primary" data-i18n="customer:payment_page.return_to_cart">Return to Cart</a>
        <a href="products.html" class="btn btn-outline" data-i18n="customer:payment_page.continue_shopping">Continue Shopping</a>
      </div>
    </div>
  </main>

  <script src="utils.js?v=22"></script>
  <script src="js/cart-utils.js?v=22"></script>
  <script>
    (function () {
      var toggle = document.getElementById('menuToggle');
      toggle.addEventListener('click', function () {
        var navLinks = document.getElementById('navLinks');
        navLinks.classList.toggle('open');
        toggle.setAttribute('aria-expanded', navLinks.classList.contains('open') ? 'true' : 'false');
      });
      toggle.setAttribute('aria-controls', 'navLinks');
      toggle.setAttribute('aria-expanded', 'false');
      updateCartCount();
    })();
  </script>
  <script src="js/language.js?v=23"></script>
  <script src="js/vendor/i18next.min.js"></script>
  <script src="js/vendor/i18next-http-backend.min.js"></script>
  <script src="js/i18n-init.js?v=1"></script>
  <script src="js/i18n-helper.js?v=1"></script>
</body>
</html>
