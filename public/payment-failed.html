<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Failed — Boularas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/navbar.css" />
  <link rel="stylesheet" href="css/buttons.css" />
  <style>
    .fail-page{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:40px 20px}
    .fail-card{max-width:480px;width:100%;text-align:center;background:var(--white);border:1px solid var(--beige);border-radius:var(--radius-lg);padding:48px 36px;box-shadow:var(--shadow-soft)}
    .fail-icon{width:72px;height:72px;border-radius:50%;background:rgba(179,83,46,.10);color:var(--danger);display:grid;place-items:center;margin:0 auto 20px}
    .fail-icon .material-symbols-outlined{font-size:36px;color:var(--danger)}
    .fail-card h1{font-family:'Inter',sans-serif !important;font-weight:500;font-size:28px;margin-bottom:8px}
    .fail-card p{color:var(--gray);font-size:15px;line-height:1.6}
    .fail-actions{display:flex;gap:12px;justify-content:center;margin-top:28px;flex-wrap:wrap}
  </style>
</head>
<body>
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="althome.html" class="brand"><img src="/assets/Boularas_Logo.png" alt="Boularas logo" class="brand-logo" /></a>
      <nav aria-label="Main navigation">
        <ul class="nav-links">
          <li><a href="althome.html">Home</a></li>
          <li><a href="products.html">Shop</a></li>
          <li><a href="categories.html">Categories</a></li>
          <li><a href="offers.html">Offers</a></li>
        </ul>
      </nav>
      <div class="navbar-actions">
        <a href="search-results.html" class="nav-search" aria-label="Search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></a>
        <a href="wishlist.html" class="nav-wish" aria-label="Wishlist"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></a>
        <a href="cart.html" class="cart-btn" aria-label="Cart"><span class="cart-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg></span><span class="cart-label">Cart</span> <span class="cart-count" id="cartCount">0</span></a>
        <button class="menu-toggle" id="menuToggle" type="button" aria-label="Toggle menu">&#9776;</button>
      </div>
    </div>
  </header>

  <main class="fail-page">
    <div class="fail-card">
      <div class="fail-icon"><span class="material-symbols-outlined">cancel</span></div>
      <h1>Payment Failed</h1>
      <p>Unfortunately, your payment could not be processed. Your order has not been placed. Please try again or choose a different payment method.</p>
      <div class="fail-actions">
        <a href="cart.html" class="btn btn-primary">Return to Cart</a>
        <a href="products.html" class="btn btn-outline">Continue Shopping</a>
      </div>
    </div>
  </main>
</body>
</html>
