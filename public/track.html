<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    .track-page{max-width:640px;margin:0 auto;padding:40px 20px}
    .track-page h1{font-size:clamp(24px,3vw,32px);margin-bottom:8px}
    .track-page .subtitle{color:var(--gray);font-size:15px;margin-bottom:28px}
    .track-input-group{display:flex;gap:12px;margin-bottom:32px}
    .track-input-wrap{flex:1;min-width:0;position:relative}
    .track-input-wrap input{width:100%;padding:14px 18px;border:1.5px solid var(--beige);border-radius:var(--radius-md);font-size:16px;letter-spacing:2px;text-transform:uppercase;background:var(--white);transition:border-color .2s,box-shadow .2s}
    .track-input-wrap input:focus{outline:none;border-color:var(--sage);box-shadow:0 0 0 4px rgba(107,127,94,.12)}
    .track-input-wrap input::placeholder{text-transform:none;letter-spacing:normal}
    .track-input-wrap input.valid{border:2px solid var(--sage) !important}
    .track-input-wrap input.invalid{border:2px solid #e41a1a !important;box-shadow:0 0 8px rgba(218,29,29,.31)}
    .validation-icon{position:absolute;right:14px;top:16px;color:var(--sage);font-size:18px;opacity:0;pointer-events:none;transition:opacity .3s ease}
    .track-input-wrap input.valid + .validation-icon{opacity:1}
    .track-result{display:none}
    .track-result.visible{display:block}
    .order-info{background:var(--white);border:1px solid var(--beige);border-radius:var(--radius-lg);padding:24px;margin-bottom:20px;box-shadow:var(--shadow-soft)}
    .order-info .order-id{font-size:13px;color:var(--gray);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
    .order-info .order-date{font-size:13px;color:var(--gray);margin-bottom:12px}
    .order-info .order-total{font-size:20px;font-weight:700;color:var(--charcoal)}
    .badge{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:var(--radius-pill);font-size:12px;font-weight:600;text-transform:capitalize}
    .badge.pending{background:rgba(201,138,58,.12);color:#8a5d10}
    .badge.processing{background:rgba(166,124,82,.12);color:var(--wood)}
    .badge.shipped{background:rgba(107,127,94,.12);color:var(--sage)}
    .badge.delivered{background:rgba(107,127,94,.14);color:var(--sage-dark)}
    .badge.cancelled{background:rgba(179,83,46,.1);color:#b3250a}
    .badge.paid{background:rgba(107,127,94,.12);color:var(--sage)}
    .badge.refunded{background:rgba(179,83,46,.1);color:#b3250a}

    .timeline{position:relative;padding-left:32px;margin:24px 0}
    .timeline::before{content:'';position:absolute;left:11px;top:0;bottom:0;width:2px;background:var(--beige)}
    .tl-step{position:relative;padding:12px 0;display:flex;align-items:flex-start;gap:12px}
    .tl-dot{position:absolute;left:-32px;top:14px;width:24px;height:24px;border-radius:50%;background:var(--beige);border:2px solid var(--white);display:grid;place-items:center;z-index:1}
    .tl-dot .material-symbols-outlined{font-size:14px;color:var(--gray)}
    .tl-step.done .tl-dot{background:var(--sage)}
    .tl-step.done .tl-dot .material-symbols-outlined{color:var(--white)}
    .tl-step.active .tl-dot{background:var(--wood);box-shadow:0 0 0 4px rgba(166,124,82,.25)}
    .tl-step.active .tl-dot .material-symbols-outlined{color:var(--white)}
    .tl-content .tl-label{font-weight:600;font-size:14px;color:var(--charcoal)}
    .tl-content .tl-date{font-size:12px;color:var(--gray);margin-top:2px}
    .tl-step.pending .tl-content .tl-label{color:var(--gray)}

    .tracking-info{background:var(--white);border:1px solid var(--beige);border-radius:var(--radius-lg);padding:24px;margin-top:20px;box-shadow:var(--shadow-soft)}
    .tracking-info h3{font-size:16px;margin-bottom:12px}
    .tracking-info .info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--beige);font-size:14px}
    .tracking-info .info-row:last-child{border-bottom:none}
    .tracking-info .info-row .label{color:var(--gray)}
    .tracking-info .info-row a{color:var(--sage);text-decoration:underline}
    .error-msg{color:#e41a1a;font-size:14px;margin-top:8px;display:none}
    .error-msg.visible{display:block}
    .auto-update-hint{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--gray);margin:-14px 0 16px}
    .auto-update-hint i{font-size:11px}
    .contact-help{display:flex;align-items:center;gap:10px;background:var(--white);border:1px solid var(--beige);border-radius:var(--radius-md);padding:14px 18px;margin-top:20px;font-size:14px;color:var(--charcoal);box-shadow:var(--shadow-soft)}
    .contact-help i{color:var(--sage);font-size:15px}
    .contact-help a{color:var(--sage);font-weight:600;text-decoration:none}
    @media(max-width:600px){.track-input-group{flex-direction:column}}
    @media(max-width:500px){.track-page{padding:24px 14px}.order-info,.tracking-info{padding:18px}}
  </style>
</head>

      <nav aria-label="Main navigation" data-i18n-attr="aria-label:customer:nav.main_nav_aria">
        <ul class="nav-links" id="navLinks">
          <li><a href="index.html" data-i18n="customer:nav.home">Home</a></li>

  <main class="track-page" id="main" tabindex="-1">
    <h1 data-i18n="customer:track.h1">Track Your Order</h1>
    <p class="subtitle" data-i18n="customer:track.subtitle">Enter your tracking code to see your order status and delivery timeline.</p>

    <div class="track-input-group">
      <div class="track-input-wrap">
        <label for="trackInput" class="sr-only" data-i18n="customer:track.input_label">Tracking number or order reference</label>
        <input type="text" id="trackInput" placeholder="e.g. WPY-XX-XXXXXXXX" maxlength="30" autocomplete="off" aria-describedby="trackError" data-i18n-attr="placeholder:customer:track.input_ph" />
        <i class="fa-solid fa-circle-check validation-icon"></i>
      </div>
      <button type="button" class="btn btn-primary" id="trackBtn" data-i18n="customer:track.track">Track</button>
    </div>
    <div class="error-msg" id="trackError" role="alert"></div>

    <div class="track-result" id="trackResult" role="status" aria-live="polite">
      <div class="order-info" id="orderInfo"></div>
      <div class="auto-update-hint" id="autoUpdateHint" style="display:none"><i class="fa-solid fa-rotate"></i> <span data-i18n="customer:track.updates">Updates automatically</span></div>
      <div class="timeline" id="timeline"></div>
      <div class="tracking-info" id="trackingInfo" style="display:none"></div>
      <div class="contact-help" id="contactHelp" style="display:none"></div>
    </div>
  </main>

  <script src="utils.js?v=22"></script>
  <script src="js/cart-utils.js?v=22"></script>
  <script>updateCartCount();</script>
  <script>
    (function () {
      var toggle = document.getElementById('menuToggle');
      var navLinks = document.getElementById('navLinks');
      if (!toggle || !navLinks) return;
      toggle.setAttribute('aria-expanded', 'false');
      toggle.addEventListener('click', function () {
        var open = navLinks.classList.toggle('open');
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
    })();
  </script>
  <script>
    (function () {
      var TRACK_STEPS = ['pending', 'confirmed', 'processing', 'shipped', 'delivered'];
      var POLL_INTERVAL = 6000;
      var NO_CHANGE_TIMEOUT = 120000;
      var FINAL_STATUSES = ['delivered', 'cancelled'];

      var currentCode = null;
      var pollTimer = null;
      var fetching = false;
      var lastStatus = null;
      var lastChangeAt = 0;

      /* Accepts either an internal code (8 chars A-Z/0-9) or a NOEST code
         (WPY-XX-XXXXXXXX shape) ÃƒÂ¢Ã¢â€šÂ¬Ã¢â‚¬Â prefix-agnostic on purpose so a future
         NOEST prefix change can never block customer tracking. */
      var TRACK_CODE_RE = /^([A-Z0-9]{8}|[A-Z0-9]{2,4}-[A-Z0-9]{2,4}-\d{6,10})$/i;

      function showPrefill() {
        var params = new URLSearchParams(window.location.search);
        var prefill = params.get('code');
        if (!prefill) return;
        document.getElementById('trackInput').value = prefill;
        doTrack(prefill);
      }
      if (window.i18n) showPrefill();
      else window.addEventListener('i18n:ready', showPrefill, { once: true });

      function validateTrackInput() {
        var input = document.getElementById('trackInput');
        var code = input.value.trim();
        var message = '';
        if (!code) {
          message = window.i18n('customer:track.err_required');
        } else if (!TRACK_CODE_RE.test(code)) {
          message = window.i18n('customer:track.err_format');
        }
        if (message) {
          input.classList.add('invalid');
          input.classList.remove('valid');
          showError(message);
          return false;
        }
        input.classList.remove('invalid');
        input.classList.add('valid');
        input.setAttribute('aria-invalid', 'false');
        document.getElementById('trackError').classList.remove('visible');
        return true;
      }

      document.getElementById('trackBtn').addEventListener('click', function () {
        if (!validateTrackInput()) return;
        doTrack(document.getElementById('trackInput').value.trim());
      });

      document.getElementById('trackInput').addEventListener('input', validateTrackInput);

      document.getElementById('trackInput').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') document.getElementById('trackBtn').click();
      });

      function showError(msg) {
        var el = document.getElementById('trackError');
        el.textContent = msg;
        el.classList.add('visible');
        document.getElementById('trackResult').classList.remove('visible');
      }

      function isFinalStatus(status) {
        return FINAL_STATUSES.indexOf(status) !== -1;
      }

      function showAutoHint() {
        document.getElementById('autoUpdateHint').style.display = 'flex';
      }

      function hideAutoHint() {
        document.getElementById('autoUpdateHint').style.display = 'none';
      }

      function stopPolling() {
        if (pollTimer) {
          clearInterval(pollTimer);
          pollTimer = null;
        }
        hideAutoHint();
      }

      function startPolling() {
        if (pollTimer) return;
        showAutoHint();
        pollTimer = setInterval(function () {
          if (!document.hidden && currentCode && !fetching) fetchTrack(currentCode, true);
        }, POLL_INTERVAL);
      }

      function onTrackSuccess(order) {
        var status = order.order_status || 'pending';
        if (isFinalStatus(status)) {
          stopPolling();
          return;
        }
        var now = Date.now();
        if (status !== lastStatus) {
          lastStatus = status;
          lastChangeAt = now;
        } else if (now - lastChangeAt > NO_CHANGE_TIMEOUT) {
          stopPolling();
          return;
        }
        startPolling();
      }

      function fetchTrack(code, silent) {
        if (fetching) return Promise.resolve();
        fetching = true;
        return fetch('/api/orders/track?code=' + encodeURIComponent(code.toUpperCase()))
          .then(function (r) {
            if (!r.ok) return r.json().then(function (d) { throw new Error(d.error || window.i18n('customer:track.not_found')); });
            return r.json();
          })
          .then(function (data) {
            var order = data.order;
            renderOrderInfo(order);
            renderTimeline(order);
            renderTrackingInfo(order);
            if (!silent) document.getElementById('trackResult').classList.add('visible');
            onTrackSuccess(order);
          })
          .catch(function (err) {
            if (!silent) showError(err.message || window.i18n('customer:track.not_found'));
          })
          .finally(function () {
            fetching = false;
          });
      }

      function doTrack(code) {
        stopPolling();
        lastStatus = null;
        lastChangeAt = 0;
        document.getElementById('trackError').classList.remove('visible');
        document.getElementById('trackResult').classList.remove('visible');
        document.getElementById('trackBtn').disabled = true;
        document.getElementById('trackBtn').textContent = window.i18n('customer:track.checking');
        currentCode = code;
        fetchTrack(code, false).finally(function () {
          document.getElementById('trackBtn').disabled = false;
          document.getElementById('trackBtn').textContent = window.i18n('customer:track.track');
        });
      }

      document.addEventListener('visibilitychange', function () {
        if (!document.hidden && pollTimer && currentCode && !fetching) fetchTrack(currentCode, true);
      });

      window.addEventListener('i18n:changed', function () {
        if (currentCode && !fetching) fetchTrack(currentCode, true);
      });

      fetch('/api/settings')
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (settings) {
          var phone = settings && settings.contact_phone;
          if (!phone || !String(phone).trim()) return;
          var p = String(phone).trim();
          var el = document.getElementById('contactHelp');
          el.innerHTML = '<i class="fa-solid fa-phone"></i> ' + window.i18n('customer:track.contact_help', { phone: escapeHtml(p) });
          el.style.display = 'flex';
        })
        .catch(function () {});

      function renderOrderInfo(order) {
        var date = order.created_at ? new Date(order.created_at.replace(' ', 'T') + 'Z').toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }) : '';
        var total = order.total_cents ? price(order.total_cents) : 'ÃƒÂ¢Ã¢â€šÂ¬Ã¢â‚¬Â';
        var os = order.order_status || 'pending';
        var ps = order.payment_status || 'pending';
        document.getElementById('orderInfo').innerHTML =
          '<div class="order-id">' + window.i18n('customer:track.order_id', { id: order.id || '' }) + '</div>' +
          '<div class="order-date">' + date + '</div>' +
          '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">' +
            '<span class="order-total">' + total + '</span>' +
            '<span class="badge ' + escapeHtml(os) + '">' + window.i18n('customer:order.status.' + os) + '</span>' +
            '<span class="badge ' + escapeHtml(ps) + '">' + window.i18n('customer:order.payment.' + ps) + '</span>' +
          '</div>';
      }

      function renderTimeline(order) {
        var status = order.order_status || 'pending';
        var currentIdx = TRACK_STEPS.indexOf(status);
        if (currentIdx === -1) currentIdx = 0;

        var html = '';
        TRACK_STEPS.forEach(function (step, i) {
          var state = i < currentIdx ? 'done' : (i === currentIdx ? 'active' : 'pending');
          var labelKey = step === 'pending' ? 'order_placed' : (step === 'confirmed' ? 'order_confirmed' : (step === 'processing' ? 'processing' : (step === 'shipped' ? 'shipped' : 'delivered')));
          html += '<div class="tl-step ' + state + '">' +
            '<div class="tl-dot"><span class="material-symbols-outlined">' + (state === 'done' ? 'check' : (state === 'active' ? 'radio_button_checked' : 'circle')) + '</span></div>' +
            '<div class="tl-content">' +
              '<div class="tl-label">' + window.i18n('customer:track.' + labelKey) + '</div>' +
              (state === 'done' || state === 'active' ? '<div class="tl-date">' + (state === 'active' ? window.i18n('customer:track.current') : window.i18n('customer:track.completed')) + '</div>' : '') +
            '</div>' +
          '</div>';
        });
        document.getElementById('timeline').innerHTML = html;
      }

      function renderTrackingInfo(order) {
        var el = document.getElementById('trackingInfo');
        var rows = [];
        if (order.payment_method) {
          var methodLabel = order.payment_method === 'cash_on_delivery' ? window.i18n('customer:track.payment_cod') :
            order.payment_method === 'card' ? window.i18n('customer:track.payment_card') :
            order.payment_method;
          rows.push('<div class="info-row"><span class="label">' + window.i18n('customer:track.payment_method') + '</span><span>' + escapeHtml(methodLabel) + '</span></div>');
        }
        if (order.tracking_number) {
          rows.push('<div class="info-row"><span class="label">' + window.i18n('customer:track.tracking_number') + '</span><span>' + escapeHtml(order.tracking_number) + '</span></div>');
        }
        if (order.carrier) {
          rows.push('<div class="info-row"><span class="label">' + window.i18n('customer:track.carrier') + '</span><span>' + escapeHtml(order.carrier) + '</span></div>');
        }
        if (order.tracking_url) {
          rows.push('<div class="info-row"><span class="label">' + window.i18n('customer:track.tracking_link') + '</span><a href="' + escapeHtml(order.tracking_url) + '" target="_blank" rel="noopener">' + window.i18n('customer:track.track_with_carrier') + '</a></div>');
        }

        if (rows.length) {
          el.innerHTML = '<h3>' + window.i18n('customer:track.shipping_details') + '</h3>' + rows.join('');
          el.style.display = 'block';
        }
      }
    })();
  </script>
