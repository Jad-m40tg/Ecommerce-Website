<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Track Order — Boularas</title>
  <meta name="description" content="Track your Boularas order status using your tracking code." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/navbar.css" />
  <link rel="stylesheet" href="css/buttons.css" />
  <link rel="stylesheet" href="css/footer.css" />
  <style>
    .track-page{max-width:640px;margin:0 auto;padding:40px 20px}
    .track-page h1{font-size:clamp(24px,3vw,32px);margin-bottom:8px}
    .track-page .subtitle{color:var(--gray);font-size:15px;margin-bottom:28px}
    .track-input-group{display:flex;gap:12px;margin-bottom:32px}
    .track-input-group input{flex:1;padding:14px 18px;border:1.5px solid var(--beige);border-radius:var(--radius-md);font-size:16px;letter-spacing:2px;text-transform:uppercase;background:var(--white);transition:border-color .2s}
    .track-input-group input:focus{outline:none;border-color:var(--sage);box-shadow:0 0 0 4px rgba(107,127,94,.12)}
    .track-input-group input::placeholder{text-transform:none;letter-spacing:normal}
    .track-result{display:none}
    .track-result.visible{display:block}
    .order-info{background:var(--white);border:1px solid var(--beige);border-radius:var(--radius-lg);padding:24px;margin-bottom:20px;box-shadow:var(--shadow-soft)}
    .order-info .order-id{font-size:13px;color:var(--gray);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
    .order-info .order-date{font-size:13px;color:var(--gray);margin-bottom:12px}
    .order-info .order-total{font-size:20px;font-weight:700;color:var(--charcoal)}
    .badge{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:var(--radius-pill);font-size:12px;font-weight:600;text-transform:capitalize}
    .badge.pending{background:rgba(201,138,58,.12);color:var(--warning)}
    .badge.processing{background:rgba(166,124,82,.12);color:var(--wood)}
    .badge.shipped{background:rgba(107,127,94,.12);color:var(--sage)}
    .badge.delivered{background:rgba(107,127,94,.14);color:var(--sage-dark)}
    .badge.cancelled{background:rgba(179,83,46,.1);color:var(--danger)}
    .badge.paid{background:rgba(107,127,94,.12);color:var(--sage)}
    .badge.refunded{background:rgba(179,83,46,.1);color:var(--danger)}

    .timeline{position:relative;padding-left:32px;margin:24px 0}
    .timeline::before{content:'';position:absolute;left:11px;top:0;bottom:0;width:2px;background:var(--beige)}
    .tl-step{position:relative;padding:12px 0;display:flex;align-items:flex-start;gap:12px}
    .tl-dot{position:absolute;left:-32px;top:14px;width:24px;height:24px;border-radius:50%;background:var(--beige);border:2px solid var(--white);display:grid;place-items:center;z-index:1}
    .tl-dot .material-symbols-outlined{font-size:14px;color:var(--gray)}
    .tl-step.done .tl-dot{background:var(--sage)}
    .tl-step.done .tl-dot .material-symbols-outlined{color:var(--white)}
    .tl-step.active .tl-dot{background:var(--wood);box-shadow:0 0 0 4px rgba(166,124,82,.25)}
    .tl-step.active .tl-dot .material-symbols-outlined{color:var(--white)}
    .tl-content .tl-label{font-weight:600;font-size:14px;color:var(--charcoal)}
    .tl-content .tl-date{font-size:12px;color:var(--gray);margin-top:2px}
    .tl-step.pending .tl-content .tl-label{color:var(--gray)}

    .tracking-info{background:var(--white);border:1px solid var(--beige);border-radius:var(--radius-lg);padding:24px;margin-top:20px;box-shadow:var(--shadow-soft)}
    .tracking-info h3{font-size:16px;margin-bottom:12px}
    .tracking-info .info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--beige);font-size:14px}
    .tracking-info .info-row:last-child{border-bottom:none}
    .tracking-info .info-row .label{color:var(--gray)}
    .tracking-info .info-row a{color:var(--sage);text-decoration:underline}
    .error-msg{color:var(--danger);font-size:14px;margin-top:8px;display:none}
    .error-msg.visible{display:block}
    @media(max-width:600px){.track-input-group{flex-direction:column}}
  </style>
</head>
<body>

  <header class="navbar">
    <div class="container navbar-inner">
      <a href="althome.html" class="brand"><img src="/assets/Boularas_Logo.png" alt="Boularas logo" class="brand-logo" /></a>
      <nav aria-label="Main navigation">
        <ul class="nav-links" id="navLinks">
          <li><a href="althome.html">Home</a></li>
          <li><a href="products.html">Shop</a></li>
          <li><a href="categories.html">Categories</a></li>
          <li><a href="offers.html">Offers</a></li>
        </ul>
      </nav>
      <div class="navbar-actions">
        <a href="search-results.html" class="nav-search" aria-label="Search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></a>
        <a href="wishlist.html" class="nav-wish" aria-label="Wishlist"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></a>
        <a href="cart.html" class="cart-btn" aria-label="Cart"><span class="cart-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg></span><span class="cart-label">Cart</span> <span class="cart-count" id="cartCount">0</span></a>
        <button class="menu-toggle" id="menuToggle" type="button" aria-label="Toggle menu">&#9776;</button>
      </div>
    </div>
  </header>

  <main class="track-page">
    <h1>Track Your Order</h1>
    <p class="subtitle">Enter your tracking code to see your order status and delivery timeline.</p>

    <div class="track-input-group">
      <input type="text" id="trackInput" placeholder="e.g. ABCD1234" maxlength="8" autocomplete="off" />
      <button type="button" class="btn btn-primary" id="trackBtn">Track</button>
    </div>
    <div class="error-msg" id="trackError"></div>

    <div class="track-result" id="trackResult">
      <div class="order-info" id="orderInfo"></div>
      <div class="timeline" id="timeline"></div>
      <div class="tracking-info" id="trackingInfo" style="display:none"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">&copy; 2026 Boularas. All rights reserved.</div>
    </div>
  </footer>

  <script src="utils.js"></script>
  <script>
    (function () {
      var TRACK_STEPS = ['pending', 'confirmed', 'processing', 'shipped', 'delivered'];
      var TRACK_LABELS = {
        pending: 'Order Placed',
        confirmed: 'Order Confirmed',
        processing: 'Processing',
        shipped: 'Shipped',
        delivered: 'Delivered'
      };

      var params = new URLSearchParams(window.location.search);
      var prefill = params.get('code');
      if (prefill) {
        document.getElementById('trackInput').value = prefill;
        doTrack(prefill);
      }

      document.getElementById('trackBtn').addEventListener('click', function () {
        var code = document.getElementById('trackInput').value.trim();
        if (!code || code.length < 4) {
          showError('Please enter a valid tracking code (at least 4 characters).');
          return;
        }
        doTrack(code);
      });

      document.getElementById('trackInput').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') document.getElementById('trackBtn').click();
      });

      function showError(msg) {
        var el = document.getElementById('trackError');
        el.textContent = msg;
        el.classList.add('visible');
        document.getElementById('trackResult').classList.remove('visible');
      }

      function doTrack(code) {
        document.getElementById('trackError').classList.remove('visible');
        document.getElementById('trackResult').classList.remove('visible');
        document.getElementById('trackBtn').disabled = true;
        document.getElementById('trackBtn').textContent = 'Checking...';

        fetch('/api/payments/track?code=' + encodeURIComponent(code.toUpperCase()))
          .then(function (r) {
            if (!r.ok) return r.json().then(function (d) { throw new Error(d.error || 'Not found'); });
            return r.json();
          })
          .then(function (data) {
            var order = data.order;
            renderOrderInfo(order);
            renderTimeline(order);
            renderTrackingInfo(order);
            document.getElementById('trackResult').classList.add('visible');
          })
          .catch(function (err) {
            showError(err.message || 'Order not found. Please check your tracking code.');
          })
          .finally(function () {
            document.getElementById('trackBtn').disabled = false;
            document.getElementById('trackBtn').textContent = 'Track';
          });
      }

      function renderOrderInfo(order) {
        var date = order.created_at ? new Date(order.created_at).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }) : '';
        var total = order.total_cents ? price(order.total_cents) : '—';
        document.getElementById('orderInfo').innerHTML =
          '<div class="order-id">Order #' + (order.id || '') + '</div>' +
          '<div class="order-date">' + date + '</div>' +
          '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">' +
            '<span class="order-total">' + total + '</span>' +
            '<span class="badge ' + escapeHtml(order.order_status || 'pending') + '">' + escapeHtml(order.order_status || 'pending') + '</span>' +
            '<span class="badge ' + escapeHtml(order.payment_status || 'pending') + '">' + escapeHtml(order.payment_status || 'pending') + '</span>' +
          '</div>';
      }

      function renderTimeline(order) {
        var status = order.order_status || 'pending';
        var currentIdx = TRACK_STEPS.indexOf(status);
        if (currentIdx === -1) currentIdx = 0;

        var html = '';
        TRACK_STEPS.forEach(function (step, i) {
          var state = i < currentIdx ? 'done' : (i === currentIdx ? 'active' : 'pending');
          html += '<div class="tl-step ' + state + '">' +
            '<div class="tl-dot"><span class="material-symbols-outlined">' + (state === 'done' ? 'check' : (state === 'active' ? 'radio_button_checked' : 'circle')) + '</span></div>' +
            '<div class="tl-content">' +
              '<div class="tl-label">' + TRACK_LABELS[step] + '</div>' +
              (state === 'done' || state === 'active' ? '<div class="tl-date">' + (state === 'active' ? 'Current status' : 'Completed') + '</div>' : '') +
            '</div>' +
          '</div>';
        });
        document.getElementById('timeline').innerHTML = html;
      }

      function renderTrackingInfo(order) {
        var el = document.getElementById('trackingInfo');
        var rows = [];
        if (order.payment_method) {
          var methodLabel = order.payment_method === 'cash_on_delivery' ? 'Cash on Delivery' :
            order.payment_method === 'card' ? 'Online (CIB / Edahabia / BaridiMob)' :
            order.payment_method;
          rows.push('<div class="info-row"><span class="label">Payment Method</span><span>' + methodLabel + '</span></div>');
        }
        if (order.tracking_number) {
          rows.push('<div class="info-row"><span class="label">Tracking Number</span><span>' + escapeHtml(order.tracking_number) + '</span></div>');
        }
        if (order.carrier) {
          rows.push('<div class="info-row"><span class="label">Carrier</span><span>' + escapeHtml(order.carrier) + '</span></div>');
        }
        if (order.tracking_url) {
          rows.push('<div class="info-row"><span class="label">Tracking Link</span><a href="' + escapeHtml(order.tracking_url) + '" target="_blank" rel="noopener">Track with carrier</a></div>');
        }

        if (rows.length) {
          el.innerHTML = '<h3>Shipping Details</h3>' + rows.join('');
          el.style.display = 'block';
        }
      }
    })();
  </script>
</body>
</html>
